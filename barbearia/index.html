<style>

:root{
  --ink:#0C1420;--panel:#131F2E;--panel2:#0F1927;--panel3:#182839;--line:#23364A;--line2:#30475F;
  --text:#E8EDF3;--muted:#8FA3B8;--faint:#5E7288;
  --verde:#3FB68B;--vermelho:#E2694E;--ambar:#E8B94A;--aco:#5B9BD5;--roxo:#B07CC6;--teal:#59C3CE;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --title:'Archivo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--ink);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--aco)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
::selection{background:rgba(63,182,139,.35)}
.mono{font-family:var(--mono)}
.faint{color:var(--faint)}.muted{color:var(--muted)}
.pos,.cr{color:var(--verde)}.neg,.db{color:var(--vermelho)}.am{color:var(--ambar)}.az{color:var(--aco)}.rx{color:var(--roxo)}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2.5px}
.ic.lg{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cabeçalho ---------- */
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101C2B,var(--ink))}
.hi{max-width:1500px;margin:0 auto;padding:20px 26px 0}
.brow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.bmark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--verde),#1E7A5C);display:grid;place-items:center;font-family:var(--title);font-weight:800;font-size:18px;color:#07110C;flex:none}
.brand h1{font-family:var(--title);font-weight:800;font-size:22px;letter-spacing:-.4px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.hact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;padding:7px 10px;min-width:220px;font-size:12.5px}
.hsearch:hover{border-color:var(--faint);color:var(--text)}
.hsearch span{flex:1;text-align:left}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.who{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.ibtn{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.ibtn:hover{color:var(--text);border-color:var(--faint)}
.ibtn.on{color:var(--verde);border-color:rgba(63,182,139,.6);background:rgba(63,182,139,.1)}
.ibtn.sm{width:28px;height:28px;border-radius:7px}
.ibtn.sm .ic{width:13px;height:13px}
.badge[hidden]{display:none}
.syncchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
.syncchip[hidden]{display:none}
.syncchip:hover{color:var(--text);border-color:var(--faint)}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.syncchip .ic{width:14px;height:14px}
.syncchip.ok i{background:var(--verde)}
.syncchip.wait i{background:var(--ambar);animation:blink 1s ease-in-out infinite}
.syncchip.bad{color:var(--vermelho);border-color:rgba(226,105,78,.5)}
.syncchip.bad i{background:var(--vermelho)}
@keyframes blink{50%{opacity:.3}}
.syncbox{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:12px;background:var(--panel2);font-size:12.5px;line-height:1.6}
.syncbox.on{border-color:rgba(63,182,139,.45)}
.syncbox h4{font-family:var(--title);font-size:13.5px;display:flex;gap:7px;align-items:center;margin-bottom:6px}
.syncbox h4 .ic{color:var(--verde)}
.steps{margin:8px 0 4px 18px;font-size:12.3px}
.steps li{margin:3px 0}
details.adv{margin-top:12px;font-size:12.5px}
details.adv summary{cursor:pointer;color:var(--muted);font-weight:600}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--vermelho);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid var(--ink)}

.ledger{margin-top:16px;border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;background:var(--panel2);overflow-x:auto}
.li{display:flex;min-width:980px}
.lc{flex:1;padding:11px 16px 9px;border-right:1px dashed var(--line);text-align:left}
.lc:last-child{border-right:none}
button.lc:hover{background:rgba(35,54,74,.35)}
.lc .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.lc .val{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.lc .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap}

nav.tabs{position:sticky;top:0;z-index:60;background:rgba(12,20,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ni{max-width:1500px;margin:0 auto;padding:0 26px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ni::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--title);font-weight:700;font-size:13px;padding:13px 13px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tb:hover{color:var(--text)}
.tb.on{color:var(--text);border-bottom-color:var(--verde)}
.tb .n{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted)}
.tb .n.r{background:rgba(226,105,78,.2);color:var(--vermelho)}

main{max-width:1500px;margin:0 auto;padding:16px 26px 70px}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:11px}
.fi{max-width:1500px;margin:0 auto;padding:14px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono)}
.fi button{color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:11px}

/* ---------- controles ---------- */

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:99px;white-space:nowrap}

.chip.on{background:rgba(63,182,139,.16);border-color:var(--verde);color:var(--verde);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--panel3);color:var(--text)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar .grow{flex:1}
.srch{position:relative;display:flex;align-items:center;min-width:200px;flex:0 1 280px}
.srch .ic{position:absolute;left:10px;color:var(--faint);pointer-events:none}
.srch .in{width:100%;padding-left:31px}
.flab{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.psum{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin:-2px 0 12px}
.psum b{color:var(--text);font-weight:600}
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.15s}
.sw input:checked+span{background:rgba(63,182,139,.45)}
.sw input:checked+span::before{transform:translateX(15px);background:var(--verde)}
.sw input:focus-visible+span{outline:2px solid var(--verde);outline-offset:2px}

/* ---------- grade e cartões ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;min-width:0}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}

@media(max-width:560px){.c2,.c3{grid-column:span 12}}
.card h3{font-family:var(--title);font-weight:700;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:8px}

.card .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.box{position:relative;height:280px}.box.tall{height:340px}.box.short{height:220px}
.kpi .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gb{height:7px;border-radius:99px;background:var(--panel2);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.gb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ambar),var(--verde))}

.dax{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--verde);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75}

.dax b{font-family:var(--mono);font-weight:600}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:12.5px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--text)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(35,54,74,.55);vertical-align:middle}

.tbl input[type=checkbox]{accent-color:var(--verde);width:15px;height:15px;cursor:pointer}
.tw{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}

.lnk{color:var(--text);font-weight:600;text-align:left}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap}
.bA{background:rgba(63,182,139,.16);color:var(--verde)}
.bB{background:rgba(232,185,74,.16);color:var(--ambar)}
.bC{background:rgba(226,105,78,.16);color:var(--vermelho)}
.bN{background:rgba(91,155,213,.16);color:var(--aco)}
.bP{background:rgba(176,124,198,.18);color:var(--roxo)}

.tg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:1px 7px 1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap}

.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--mono);font-size:9.5px;font-weight:600;color:#07110C;flex:none}

.av.none{background:var(--panel3);color:var(--faint);border:1px dashed var(--line2)}
.who-cell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* ---------- kanban ---------- */

.dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:border-color .12s,transform .12s}

.dt{font-weight:600;font-size:12.8px;line-height:1.35}

.hs{font-family:var(--mono);font-size:10px;font-weight:600;border-radius:6px;padding:1px 5px;flex:none}
.hs.hA{background:rgba(63,182,139,.16);color:var(--verde)}
.hs.hB{background:rgba(232,185,74,.16);color:var(--ambar)}

.ast{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);color:var(--muted)}

.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:none;gap:10px;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(12,20,32,0),rgba(12,20,32,.96) 35%)}

.dz{flex:1;max-width:340px;margin:0 auto;height:62px;border:2px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--title);font-weight:700;font-size:13.5px;color:var(--muted);background:var(--panel2);transition:.12s}

function calcA(a){
  const serv=a.itens.filter(i=>i.t==='s'),prod=a.itens.filter(i=>i.t==='p');
  const vServ=sum(serv,i=>num(i.preco)*num(i.qtd||1)),vProd=sum(prod,i=>num(i.preco)*num(i.qtd||1));
  const bruto=Math.max(0,vServ+vProd-num(a.desconto));
  const taxa=bruto*num(S.cfg.taxas[a.forma]);
  const b=IX.b[a.barbeiroId]||{com:0};
  const com=!num(b.com)?0:a.assinante?num(S.cfg.comAssin)*serv.length:Math.max(0,vServ-num(a.desconto))*num(b.com);
  const mat=sum(serv,i=>num((IX.s[i.id]||{}).material)*num(i.qtd||1));
  const cmv=sum(prod,i=>num((IX.p[i.id]||{}).custo)*num(i.qtd||1));
  return {vServ,vProd,bruto,taxa,imp:bruto*num(S.cfg.imposto),com,mat,cmv};

  const com=sum(at,x=>x.com),mat=sum(at,x=>x.mat),cmv=sum(at,x=>x.cmv);

function estoque(){const out={};S.produtos.forEach(p=>{const ent=sum(S.compras.filter(c=>c.produtoId===p.id),c=>num(c.qtd));
  const sai=sum(S.atend,a=>sum(a.itens.filter(i=>i.t==='p'&&i.id===p.id),i=>num(i.qtd||1)));const sal=num(p.ini)+ent-sai;
  out[p.id]={ent,sai,saldo:sal,sit:sal<=0?'Sem estoque':sal<num(p.min)?'Repor':'OK'};});return out;}
function comissoes(ym){const M=month(ym);return S.barbeiros.map(b=>{const xs=M.at.filter(x=>x.a.barbeiroId===b.id);
  const vales=sum(S.vales.filter(v=>v.barbeiroId===b.id&&v.date.slice(0,7)===ym),v=>num(v.valor));const com=sum(xs,x=>x.com);
  return {b,n:xs.length,assin:xs.filter(x=>x.a.assinante).length,fatServ:sum(xs,x=>x.vServ),fat:sum(xs,x=>x.bruto),com,vales,pagar:com-vales,pago:S.comPag[ym+'|'+b.id]||''};});}
function precos(ym){const M=month(ym);const fixoMin=M.mins?M.fixas/(M.mins/M.frac):0;const fixoAt=M.n?M.fixas/(M.n/M.frac):0;
  const tx=M.serv+M.prod?M.taxas/(M.serv+M.prod-M.desc):0;const comMed=sum(S.barbeiros,b=>num(b.com))/Math.max(1,S.barbeiros.length);
  return {fixoAt,tx,rows:S.servicos.map(s=>{const xs=M.at.filter(x=>x.a.itens.some(i=>i.t==='s'&&i.id===s.id)&&!x.a.assinante);
    const q=sum(xs,x=>sum(x.a.itens.filter(i=>i.t==='s'&&i.id===s.id),i=>num(i.qtd||1)));
    const fixo=num(s.min)*fixoMin,p=num(s.preco),custo=p*comMed+p*tx+p*num(S.cfg.imposto)+num(s.material)+fixo,marg=p-custo;
    const alvo=.2,sug=(num(s.material)+fixo)/(1-comMed-tx-num(S.cfg.imposto)-alvo);
    return {s,q,fat:q*p,com:p*comMed,taxa:p*tx,imp:p*num(S.cfg.imposto),mat:num(s.material),fixo,marg,mp:p?marg/p:0,sug};}),fixoMin};}
function assinStats(ym){const M=month(ym);return S.assinantes.map(a=>{const us=M.at.filter(x=>x.a.assinante&&x.a.cliente===a.cliente);
  const pg=S.assinPag.find(p=>p.assinId===a.id&&p.ym===ym);const custo=sum(us,x=>x.com+x.mat)+num(a.valor)*num(S.cfg.imposto);
  return {a,usos:us.length,pg,custo,res:num(a.valor)-custo};});}

  S.produtos.forEach(p=>{const x=E[p.id];if(x.sit!=='OK')out.push({lvl:x.sit==='Sem estoque'?'db':'am',t:'Repor estoque · '+p.nome,s:'saldo '+x.saldo+' · mínimo '+p.min,act:'newCompra',id:p.id});});
  S.assinPag.filter(p=>!p.pago).forEach(p=>{const a=IX.a[p.assinId];if(a)out.push({lvl:'am',t:'Assinatura pendente · '+a.cliente,s:a.plano+' · '+fR(p.valor)+' · venceu '+fD(p.date),act:'receber',id:p.id});});

  return out;}

      ${al.length?'<div style="display:flex;flex-direction:column;gap:7px;max-height:228px;overflow:auto">'+al.map(x=>`<button class="alertln${x.lvl==='db'?' bad':''}" data-act="${x.act}" data-id="${x.id||''}" data-tab="${x.tab||''}" style="text-align:left">${ic(x.lvl==='db'?'alert':'clock')}<div><b>${esc(x.t)}</b><div class="faint" style="font-size:11.5px">${esc(x.s)}</div></div></button>`).join('')+'</div>':'<div class="alertln ok">'+ic('check')+'<div>Nenhuma pendência.</div></div>'}</div>
  </div>`;
  const y=+U.mes.slice(0,4),m=+U.mes.slice(5,7),nd=new Date(y,m,0).getDate();const days=[...Array(nd)].map((_,i)=>U.mes+'-'+pad(i+1));
  const byDay=days.map(d=>sum(M.at.filter(x=>x.a.date===d),x=>x.bruto));
  mkChart('chDia',{type:'bar',data:{labels:days.map(d=>pD(d).getDate()),datasets:[{label:'Faturamento',data:byDay,backgroundColor:days.map(d=>pD(d).getDay()===6?COLORS.teal:COLORS.aco),borderRadius:3},
    {type:'line',label:'Média diária',data:days.map(()=>sum(byDay)/Math.max(1,byDay.filter(v=>v>0).length)),borderColor:COLORS.ambar,borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},
    options:{maintainAspectRatio:false,scales:{y:axisR},plugins:{tooltip:{callbacks:{title:c=>DOW[pD(days[c[0].dataIndex]).getDay()]+', '+fD(days[c[0].dataIndex]),label:c=>c.dataset.label+': '+fR(c.raw)}}}}});
  const fs=FORMAS.filter(f=>f!=='Assinatura');const fv=fs.map(f=>sum(M.at.filter(x=>x.a.forma===f),x=>x.bruto)).concat([M.assin]);
  mkChart('chForma',{type:'doughnut',data:{labels:fs.concat(['Assinaturas']),datasets:[{data:fv,backgroundColor:fs.map(f=>FORMA_COR[f]).concat([COLORS.ambar]),borderWidth:0}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.label+': '+fR(c.raw)+' ('+fP(c.raw/Math.max(1,sum(fv)))+')'}}}}});
  const bs=S.barbeiros;mkChart('chBarb',{type:'bar',data:{labels:bs.map(b=>b.nome),datasets:[{label:'Faturamento',data:bs.map(b=>sum(M.at.filter(x=>x.a.barbeiroId===b.id),x=>x.bruto)),backgroundColor:PAL,borderRadius:4}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fR(c.raw)+' · '+M.at.filter(x=>x.a.barbeiroId===bs[c.dataIndex].id).length+' atendimentos'}}},scales:{x:axisR}}});
  const ss=S.servicos;const sq=ss.map(s=>sum(M.at,x=>sum(x.a.itens.filter(i=>i.t==='s'&&i.id===s.id),i=>num(i.qtd||1))));
  mkChart('chServ',{type:'bar',data:{labels:ss.map(s=>s.nome),datasets:[{data:sq,backgroundColor:COLORS.teal,borderRadius:4}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>fN(v)}}}}});
};

/* ---------------- CAIXA DO DIA ---------------- */
VIEWS.caixa=()=>{const at=S.atend.filter(a=>a.date===U.dia).sort((a,b)=>a.hora.localeCompare(b.hora));const xs=at.map(a=>Object.assign({a},calcA(a)));
  const tot=sum(xs,x=>x.bruto),tax=sum(xs,x=>x.taxa);const pagos=xs.filter(x=>!x.a.assinante);
  $('#main').innerHTML=`<div class="tbar"><button class="ibtn" data-act="dia" data-n="-1" aria-label="Dia anterior">${ic('chevL')}</button><input class="in sm mono" type="date" value="${U.dia}" data-ch="dia"><button class="ibtn" data-act="dia" data-n="1" aria-label="Próximo dia">${ic('chevR')}</button>
    <span class="faint" style="font-size:12.5px">${DOW[pD(U.dia).getDay()]} · ${U.dia===TODAY?'hoje':rel(U.dia)}</span><span class="grow"></span><button class="btn pri" data-act="newAtend">${ic('plus')}Atendimento</button></div>
  <div class="grid">
    ${kpi('Total do dia',fR2(tot),fN(at.length)+' atendimentos · ticket '+fR2(pagos.length?sum(pagos,x=>x.bruto)/pagos.length:0),'cr',null,'c2')}
    ${['Pix','Crédito','Débito','Dinheiro'].map(f=>{const v=sum(xs.filter(x=>x.a.forma===f),x=>x.bruto);return kpi(f,fR2(v),f==='Dinheiro'?'confira com a gaveta':num(S.cfg.taxas[f])?'taxa '+fP(S.cfg.taxas[f])+' · líquido '+fR2(v*(1-num(S.cfg.taxas[f]))):'sem taxa','',null,'c2');}).join('')}
    ${kpi('Líquido após taxas',fR2(tot-tax),'taxas da maquininha '+fR2(tax),'az',null,'c2')}
    ${U.dia===TODAY?(R=>`<div class="card resstrip"><div class="rs-ic">${ic('save')}</div><div class="grow"><b>Reserva das contas fixas.</b> ${R.falta?'Do caixa de hoje ('+fR(tot)+'), separe <b class="mono">'+fR(R.falta)+'</b>'+(tot?' ('+fP(R.falta/tot,0)+' do que entrou até agora)':'')+' para pagar as próximas contas em dia'+(R.prox?': '+esc(R.prox.c.desc)+' vence em '+fD(R.prox.c.venc)+'.':'.'):'O valor de hoje já foi guardado ('+fR(R.guardadoHoje)+'). Reserva atual: '+fR(R.saldo)+'.'}</div><button class="btn sm ${R.falta?'pri':''}" data-act="guardar">${ic('save')}Registrar</button></div>`)(reserva()):''}
    <div class="card c8" style="padding:0"><div class="sh"><h2>Atendimentos</h2><span class="faint" style="font-size:12px">clique no cliente para editar</span></div>
      <div class="tw" style="border:none;border-radius:0 0 11px 11px"><table class="tbl"><thead><tr><th>Hora</th><th>Cliente</th><th>Barbeiro</th><th>Serviços e produtos</th><th>Pagamento</th><th class="r">Valor</th><th class="r">Taxa</th><th class="r">Comissão</th><th></th></tr></thead><tbody>
      ${xs.map(x=>{const a=x.a;return `<tr><td class="m">${esc(a.hora)}</td><td><button class="lnk" data-act="editAtend" data-id="${a.id}">${esc(a.cliente||'—')}</button>${a.assinante?' '+bdg('Assinatura'):''}</td><td>${esc((IX.b[a.barbeiroId]||{}).nome||'—')}</td>
        <td>${a.itens.map(i=>esc((i.t==='s'?IX.s[i.id]:IX.p[i.id])?.nome||'?')+(num(i.qtd)>1?' ×'+i.qtd:'')).join(' + ')}${num(a.desconto)?'<span class="sub2">desconto '+fR2(num(a.desconto))+'</span>':''}</td>
        <td>${esc(a.forma)}</td><td class="m r"><b>${fR2(x.bruto)}</b></td><td class="m r">${x.taxa?fR2(x.taxa):'—'}</td><td class="m r">${fR2(x.com)}</td>
        <td class="r"><button class="ibtn sm" data-act="delAtend" data-id="${a.id}" aria-label="Excluir atendimento">${ic('trash')}</button></td></tr>`;}).join('')||'<tr><td colspan="9">'+empty('Nenhum atendimento neste dia.'+(pD(U.dia).getDay()===0?' A barbearia fecha aos domingos.':''))+'</td></tr>'}
      </tbody></table></div></div>
    <div class="card c4"><h2>Fechamento por barbeiro</h2><p class="sub" style="margin-bottom:10px">o que cada um fez hoje</p>
      <table class="tbl"><thead><tr><th>Barbeiro</th><th class="r">Atend.</th><th class="r">Valor</th><th class="r">Comissão</th></tr></thead><tbody>
      ${S.barbeiros.map(b=>{const ys=xs.filter(x=>x.a.barbeiroId===b.id);return `<tr><td>${esc(b.nome)}</td><td class="m r">${ys.length}</td><td class="m r">${fR(sum(ys,x=>x.bruto))}</td><td class="m r">${fR2(sum(ys,x=>x.com))}</td></tr>`;}).join('')}
      <tr><td><b>Total</b></td><td class="m r"><b>${xs.length}</b></td><td class="m r"><b>${fR(tot)}</b></td><td class="m r"><b>${fR2(sum(xs,x=>x.com))}</b></td></tr></tbody></table>
      <div class="notebox" style="margin-top:12px;font-size:12px">Produtos vendidos hoje: <b>${fN(sum(at,a=>sum(a.itens.filter(i=>i.t==='p'),i=>num(i.qtd||1))))}</b> · ${fR2(sum(xs,x=>x.vProd))}</div></div>
  </div>`;};

    <div class="card c6"><h2>Comissão × faturamento</h2><div style="height:220px;margin-top:8px"><canvas id="chCom"></canvas></div></div>

      ${S.vales.filter(v=>v.date.slice(0,7)===U.mes).map(v=>`<tr><td class="m">${fD(v.date)}</td><td>${esc((IX.b[v.barbeiroId]||{}).nome||'—')}</td><td>${esc(v.obs||'')}</td><td class="m r">${fR2(num(v.valor))}</td><td class="r"><button class="ibtn sm" data-act="delVale" data-id="${v.id}" aria-label="Excluir vale">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="5">'+empty('Nenhum vale neste mês.')+'</td></tr>'}
    </tbody></table></div></div></div>`;
  mkChart('chCom',{type:'bar',data:{labels:rows.map(r=>r.b.nome),datasets:[{label:'Faturamento',data:rows.map(r=>r.fat),backgroundColor:COLORS.aco,borderRadius:4},{label:'Comissão',data:rows.map(r=>r.com),backgroundColor:COLORS.ambar,borderRadius:4}]},options:{maintainAspectRatio:false,scales:{y:axisR}}});};

/* ---------------- FINANCEIRO ---------------- */
VIEWS.financeiro=()=>{const M=month(U.mes);const cs=S.contas.filter(c=>c.venc.slice(0,7)===U.mes).sort((a,b)=>a.venc.localeCompare(b.venc));
  const PJ=M.frac<1;const line=(l,v,cls,fixo)=>`<tr class="${cls||''}"><td>${l}</td><td class="m r">${fR2(v)}</td>${PJ?'<td class="m r">'+fR2(fixo?v:v/M.frac)+'</td>':''}<td class="m r faint">${M.bruta?fP((fixo&&PJ?v/M.brutaProj:v/M.bruta)):'—'}</td></tr>`;
  const ms=[...Array(6)].map((_,i)=>ymAdd(U.mes,i-5)).filter(m=>S.atend.some(a=>a.date.slice(0,7)===m));
  const RF=resFin();
  $('#main').innerHTML=`<div class="tbar">${monthSel()}<span class="grow"></span><button class="btn pri" data-act="newConta">${ic('plus')}Conta a pagar</button></div>
  <div class="grid">
    ${RF.html}
    <div class="card c6"><h2>Resultado do mês (DRE)</h2><p class="sub" style="margin-bottom:10px">${ymLong(U.mes)}${M.frac<1?' · até '+fD(TODAY):''}</p>
      <div style="overflow-x:auto"><table class="tbl dre"><thead><tr><th></th><th class="r">${PJ?'Até hoje':'R$'}</th>${PJ?'<th class="r">Projeção do mês</th>':''}<th class="r">% receita</th></tr></thead><tbody>
      ${line('Serviços',M.serv-M.desc)}${line('Produtos',M.prod)}${line('Assinaturas recebidas',M.assin)}
      ${line('<b>Receita bruta</b>',M.bruta,'tot')}${line('(−) Impostos ('+fP(S.cfg.imposto)+')',-M.imp)}${line('(−) Taxas da maquininha',-M.taxas)}
      ${line('<b>Receita líquida</b>',M.liq,'tot')}${line('(−) Comissões',-M.com)}${line('(−) Material dos serviços',-M.mat)}${line('(−) Custo dos produtos vendidos',-M.cmv)}
      ${line('<b>Margem de contribuição</b>',M.mc,'tot')}${line('(−) Despesas fixas',-M.fixas,'',true)}
      <tr class="tot big"><td><b>Resultado do mês</b></td><td class="m r ${M.res<0?'neg':'pos'}"><b>${fR2(M.res)}</b></td>${PJ?'<td class="m r '+(M.resProj<0?'neg':'pos')+'"><b>'+fR2(M.resProj)+'</b></td>':''}<td class="m r">${PJ?(M.brutaProj?fP(M.resProj/M.brutaProj):'—'):(M.bruta?fP(M.res/M.bruta):'—')}</td></tr></tbody></table></div>
      ${PJ?'<p class="faint" style="font-size:11.5px;margin-top:8px">O mês ainda não acabou: as despesas fixas já entram inteiras, por isso o resultado até hoje fica menor. A projeção estende receitas e custos variáveis pelo ritmo de '+fP(M.frac,0)+' do mês e mantém as despesas fixas.</p>':''}</div>
    <div class="card c6"><h2>Ponto de equilíbrio</h2><p class="sub" style="margin-bottom:12px">quanto a barbearia precisa faturar para pagar todas as despesas fixas</p>
      <div class="grid" style="gap:10px">
        <div class="card c6 kpi" style="padding:12px"><div class="lab">Faturamento mínimo</div><div class="val am">${M.pe?fR(M.pe):'—'}</div><div class="dl">despesas fixas ÷ margem de ${fP(M.mcp)}</div></div>
        <div class="card c6 kpi" style="padding:12px"><div class="lab">Em atendimentos</div><div class="val">${M.pe?fN(Math.ceil(M.pe/Math.max(1,M.ticket))):'—'}</div><div class="dl">com ticket médio de ${fR2(M.ticket)}</div></div></div>
      <div style="margin-top:14px"><div class="pmeta"><span>Faturado ${fR(M.bruta)} de ${M.pe?fR(M.pe):'—'}</span><b class="mono">${M.pe?fP(M.bruta/M.pe,0):'—'}</b></div>${M.pe?pbar(M.bruta/M.pe,M.bruta>=M.pe?COLORS.verde:COLORS.ambar):''}</div>
      <div style="height:170px;margin-top:14px"><canvas id="chRes"></canvas></div></div>
    <div class="card" style="padding:0"><div class="sh"><h2>Contas a pagar</h2><span class="faint" style="font-size:12px">${ymLong(U.mes)} · pendentes ${fR2(sum(cs.filter(c=>!c.pago),c=>num(c.valor)))}</span></div>
      <div class="tw" style="border:none;border-radius:0 0 11px 11px"><table class="tbl"><thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
      ${cs.map(c=>{const st=c.pago?'Pago':c.venc<TODAY?'Vencida':'Pendente';return `<tr><td class="m ${st==='Vencida'?'neg':''}">${fD(c.venc)}</td><td>${esc(c.desc)}</td><td>${esc(c.cat)}</td><td class="m r">${fR2(num(c.valor))}</td><td>${bdg(st)}</td>
        <td class="nw r">${c.pago?'':'<button class="btn sm" data-act="pagar" data-id="'+c.id+'">'+ic('check')+'Pagar</button> '}<button class="ibtn sm" data-act="delConta" data-id="${c.id}" aria-label="Excluir conta">${ic('trash')}</button></td></tr>`;}).join('')||'<tr><td colspan="6">'+empty('Nenhuma conta neste mês.')+'</td></tr>'}
      </tbody></table></div></div></div>`;
  RF.chart();const Ms=ms.map(month);mkChart('chRes',{type:'bar',data:{labels:Ms.map(x=>ymLab(x.ym)+(x.frac<1?' (prev.)':'')),datasets:[{label:'Receita bruta',data:Ms.map(x=>x.brutaProj),backgroundColor:Ms.map(x=>x.frac<1?'rgba(91,155,213,.45)':COLORS.aco),borderRadius:4},{label:'Resultado',data:Ms.map(x=>x.resProj),backgroundColor:Ms.map(x=>x.resProj<0?COLORS.vermelho:COLORS.verde),borderRadius:4}]},options:{maintainAspectRatio:false,scales:{y:axisR},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+(Ms[c.dataIndex].frac<1?' (projeção)':'')+': '+fR(c.raw)}}}}});};

/* ---------------- SERVIÇOS E PREÇOS ---------------- */
VIEWS.servicos=()=>{const P=precos(U.mes);
  $('#main').innerHTML=`<div class="tbar">${monthSel()}<span class="faint" style="font-size:12px">Preço, comissão, taxa, imposto, material e a parte das despesas fixas que cada atendimento precisa cobrir</span><span class="grow"></span><button class="btn" data-act="newServ">${ic('plus')}Serviço</button></div>
  <div class="psum"><span>Despesas fixas por minuto de cadeira <b>${fR2(P.fixoMin)}</b></span><span>por atendimento <b>${fR2(P.fixoAt)}</b></span><span>Taxa média da maquininha <b>${fP(P.tx)}</b></span><span>Imposto <b>${fP(S.cfg.imposto)}</b></span><span class="faint">Edite preço e material direto na tabela</span></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Serviço</th><th class="r">Preço</th><th class="r">Tempo (min)</th><th class="r">Material</th><th class="r">Qtd no mês</th><th class="r">Comissão</th><th class="r">Taxa + imposto</th><th class="r">Despesa fixa (pelo tempo)</th><th class="r">Sobra por atendimento</th><th>Situação</th><th class="r">Preço p/ 20% de margem</th></tr></thead><tbody>
  ${P.rows.map(r=>{const st=r.marg<0?'Prejuízo':r.mp<.1?'Atenção':'Lucrativo';return `<tr><td><b>${esc(r.s.nome)}</b></td>
    <td class="r"><input class="in sm mono r" type="number" step="1" min="0" value="${num(r.s.preco)}" data-serv="${r.s.id}" data-f="preco" style="width:80px"></td>
    <td class="r"><input class="in sm mono r" type="number" step="5" min="0" value="${num(r.s.min)}" data-serv="${r.s.id}" data-f="min" style="width:70px"></td>
    <td class="r"><input class="in sm mono r" type="number" step="0.5" min="0" value="${num(r.s.material)}" data-serv="${r.s.id}" data-f="material" style="width:74px"></td>
    <td class="m r">${fN(r.q)}</td><td class="m r">${fR2(r.com)}</td><td class="m r">${fR2(r.taxa+r.imp)}</td><td class="m r">${fR2(r.fixo)}</td>
    <td class="m r ${r.marg<0?'neg':'pos'}"><b>${fR2(r.marg)}</b><span class="sub2">${fP(r.mp)}</span></td><td>${bdg(st)}</td><td class="m r">${r.sug>0?fR2(Math.ceil(r.sug)):'—'}</td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="notebox" style="margin-top:12px;font-size:12.5px;line-height:1.6"><b>Como ler:</b> as despesas fixas do mês (aluguel, pró-labore, energia e outras) são divididas pelos minutos de cadeira usados, e cada serviço carrega a parte do tempo que ocupa. Um serviço com sobra negativa não paga a própria parte dessas contas. A coluna da direita mostra o preço que daria 20% de sobra.${month(U.mes).frac<1?" No mês corrente, o rateio usa a projeção do mês inteiro.":""}</div>`;};

/* ---------------- ESTOQUE ---------------- */
VIEWS.estoque=()=>{const E=estoque();const vend=ym=>Object.fromEntries(S.produtos.map(p=>[p.id,sum(ofMonth(ym),a=>sum(a.itens.filter(i=>i.t==='p'&&i.id===p.id),i=>num(i.qtd||1)))]));const V=vend(U.mes);
  $('#main').innerHTML=`<div class="tbar">${monthSel()}<span class="grow"></span><button class="btn" data-act="newProd">${ic('plus')}Produto</button><button class="btn pri" data-act="newCompra">${ic('plus')}Compra / entrada</button></div>

  if(view==='dia'){const el=$('.cal-scroll');if(el&&d===TODAY){el.scrollTop=Math.max(0,(nowMin()-ABRE-150)*PXM);}}
};
function projTxt(){const ds=[...Array(14)].map((_,k)=>addD(TODAY,k)).filter(x=>pD(x).getDay()!==0);const MD=mediasDow();

function calDia(d){const bs=S.barbeiros,n=bs.length,H=FECHA-ABRE;const gs=S.agenda.filter(g=>g.date===d);

  return `<div class="wk">${days.map(x=>{const I=diaInfo(x),gs=I.gs.slice().sort((a,b)=>a.hora.localeCompare(b.hora));

function miniMes(d){const y=pD(d).getFullYear(),m=pD(d).getMonth(),first=new Date(y,m,1),nd=new Date(y,m+1,0).getDate();const cells=[];

/* =====================================================================
   RESERVA DIÁRIA PARA AS CONTAS FIXAS
   ===================================================================== */
function diasAbertos(a,b){let k=0;for(let d=a;d<b;d=addD(d,1))if(pD(d).getDay()!==0)k++;return k;}
function reservaTaxa(dia,saldo,abertas){const lim=addD(dia,RES_HOR);
  const cs=abertas.filter(c=>c.venc<=lim).slice().sort((a,b)=>a.venc.localeCompare(b.venc));let cum=0,taxa=0,alvo=null;
  cs.forEach((c,i)=>{cum+=num(c.valor);const nx=cs[i+1];if(nx&&nx.venc===c.venc)return;const due=c.venc<dia?dia:c.venc;const dias=Math.max(1,diasAbertos(dia,due));
    const r=(cum-saldo)/dias;if(r>taxa){taxa=r;alvo={venc:c.venc,cum,dias};}});
  return {taxa,alvo,cs};}
function reserva(){const fx=S.contas.filter(c=>c.cat==='Despesa fixa'&&!c.pago);
  const saldo=sum(S.reserva,r=>num(r.valor));const guardadoHoje=sum(S.reserva.filter(r=>r.date===TODAY&&num(r.valor)>0&&!r.contaId),r=>num(r.valor));
  const T=reservaTaxa(TODAY,saldo-guardadoHoje,fx);const meta=T.taxa>0?Math.ceil(T.taxa/5)*5:0;
  let rest=saldo;const rows=T.cs.map(c=>{const v=num(c.valor);const cob=Math.max(0,Math.min(v,rest));rest-=cob;return {c,v,cob,falta:v-cob,dias:diasAbertos(TODAY,c.venc<TODAY?TODAY:c.venc)};});
  const prox=rows.find(r=>r.falta>0)||rows[0]||null;
  const ini=addD(TODAY,-28),fat=sum(S.atend.filter(a=>a.date>=ini&&a.date<TODAY),a=>calcA(a).bruto),mdia=fat/Math.max(1,diasAbertos(ini,TODAY));
  return {saldo,meta,guardadoHoje,falta:Math.max(0,meta-guardadoHoje),alvo:T.alvo,rows,prox,total:sum(rows,r=>r.v),mdia};}
function resResumo(R){if(!R.alvo)return 'As contas fixas dos próximos '+RES_HOR+' dias já estão cobertas pela reserva.';
  const cs=R.rows.filter(r=>r.c.venc<=R.alvo.venc);
  return 'Guardando '+fR(R.meta)+' por dia de funcionamento, a reserva chega a '+fR(R.alvo.cum)+' em '+fD(R.alvo.venc)+', o suficiente para '+(cs.length===1?esc(cs[0].c.desc):cs.length+' contas, de '+esc(cs[0].c.desc)+' até '+esc(cs[cs.length-1].c.desc))+'.';}
function resCard(){const R=reserva(),p=R.prox;
  return `<div class="hrow" style="margin-bottom:4px"><h2 style="font-size:15px">Reserva das contas fixas</h2>${R.falta?'':bdg('OK')}</div>
    <p class="faint" style="font-size:11.5px;margin-bottom:10px">quanto separar do caixa de hoje para pagar as próximas contas em dia</p>
    <div class="resbig"><div><div class="lab">Guardar hoje</div><div class="val mono ${R.falta?'am':'cr'}">${R.falta?fR(R.falta):'feito'}</div></div>
      <div class="r"><div class="lab">Reserva atual</div><div class="val mono">${fR(R.saldo)}</div></div></div>
    ${R.guardadoHoje?'<p class="faint" style="font-size:11.5px;margin-top:6px">já guardado hoje: '+fR(R.guardadoHoje)+' de '+fR(R.meta)+'</p>':''}
    ${p?`<div class="resnext"><div class="pmeta"><span>Próxima: <b>${esc(p.c.desc)}</b> · ${fD(p.c.venc)}</span><b class="mono">${fR(p.v)}</b></div>${pbar(p.v?p.cob/p.v:1,p.cob>=p.v?COLORS.verde:COLORS.ambar)}
      <div class="faint" style="font-size:11px;margin-top:4px">${p.cob>=p.v?'já coberta pela reserva':fR(p.cob)+' já guardados · '+(p.dias?p.dias+' dias de funcionamento até o vencimento':'vence hoje')}</div></div>`:''}
    <button class="btn sm ${R.falta?'pri':''}" style="margin-top:12px;width:100%;justify-content:center" data-act="guardar">${ic('save')}Registrar valor guardado</button>`;}
function resFin(){const R=reserva();
  const hist=[];let sd=0;const ini=addD(TODAY,-60);S.reserva.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{sd+=num(r.valor);hist.push([r.date,sd]);});
  const ds=[];for(let d=ini;d<=TODAY;d=addD(d,1))ds.push(d);let j=0,cur=0;const hs=hist;const serie=ds.map(d=>{while(j<hs.length&&hs[j][0]<=d){cur=hs[j][1];j++;}return cur;});
  const mov=S.reserva.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).slice(0,6);
  return {R,html:`<div class="card"><div class="hrow"><div><h2>Reserva diária para as contas fixas</h2><p class="sub">quanto guardar a cada dia de funcionamento para pagar as contas fixas dos próximos ${RES_HOR} dias sem aperto</p></div><button class="btn ${R.falta?'pri':''}" data-act="guardar">${ic('save')}Registrar valor guardado</button></div>
    <div class="grid" style="gap:10px;margin-top:12px">
      ${kpi('Guardar hoje',R.falta?fR(R.falta):'feito',R.guardadoHoje?'guardado hoje '+fR(R.guardadoHoje)+' de '+fR(R.meta):'valor do dia calculado às '+m2hm(nowMin()),R.falta?'am':'cr',null,'c3')}
      ${kpi('Reserva atual',fR(R.saldo),'dinheiro já separado para as contas','az',null,'c3')}
      ${kpi('Contas fixas a cobrir',fR(R.total),R.rows.length+' contas até '+fD(addD(TODAY,RES_HOR)),'',null,'c3')}
      ${kpi('Peso no caixa do dia',R.mdia?fP(R.meta/R.mdia,0):'—','do faturamento médio diário ('+fR(R.mdia)+')','',null,'c3')}</div>
    <div class="notebox" style="margin:12px 0;font-size:12.5px;line-height:1.6">${resResumo(R)} O valor é recalculado todo dia: se um dia o caixa for fraco e der para guardar menos, os dias seguintes compensam.</div>
    <div class="grid" style="gap:14px"><div class="c7" style="min-width:0"><div class="tw"><table class="tbl"><thead><tr><th>Vencimento</th><th>Conta</th><th class="r">Valor</th><th class="r">Dias até lá</th><th style="width:30%">Coberto pela reserva</th><th class="r">Falta</th></tr></thead><tbody>
      ${R.rows.map(r=>`<tr><td class="m ${r.c.venc<TODAY?'neg':''}">${fD(r.c.venc)}</td><td>${esc(r.c.desc)}${r.c.venc<TODAY?' '+bdg('Vencida'):''}</td><td class="m r">${fR2(r.v)}</td><td class="m r">${r.dias}</td><td>${pbar(r.v?r.cob/r.v:1,r.cob>=r.v?COLORS.verde:COLORS.ambar)}</td><td class="m r ${r.falta?'':'pos'}">${r.falta?fR2(r.falta):'ok'}</td></tr>`).join('')||'<tr><td colspan="6">'+empty('Nenhuma conta fixa em aberto.')+'</td></tr>'}
      </tbody></table></div></div>
      <div class="c5" style="min-width:0"><div style="height:170px"><canvas id="chRes2"></canvas></div>
        <div class="tw" style="margin-top:8px"><table class="tbl"><tbody>${mov.map(r=>`<tr><td class="m">${fD(r.date)}</td><td>${esc(r.obs||'')}</td><td class="m r ${num(r.valor)<0?'neg':'pos'}">${(num(r.valor)>0?'+':'')+fR2(num(r.valor))}</td><td class="r"><button class="ibtn sm" data-act="delRes" data-id="${r.id}" aria-label="Excluir movimento">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div></div></div></div>`,
    chart:()=>mkChart('chRes2',{type:'line',data:{labels:ds.map(d=>fDs(d)),datasets:[{label:'Reserva',data:serie,borderColor:COLORS.aco,backgroundColor:'rgba(91,155,213,.15)',fill:true,pointRadius:0,borderWidth:2,stepped:true}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Reserva: '+fR(c.raw)}}},scales:{y:axisR,x:{ticks:{maxTicksLimit:7}}}}})};}
function guardarModal(){const R=reserva();
  simple('Reserva das contas fixas',[{k:'tipo',label:'Movimento',type:'select',options:['Guardar na reserva','Retirar da reserva'],w:'half'},{k:'date',label:'Data',type:'date',value:TODAY,w:'half'},
    {k:'valor',label:'Valor (R$)',type:'number',step:'0.01',value:R.falta||R.meta||'',w:'half',help:R.falta?'sugestão de hoje: '+fR(R.falta):''},{k:'obs',label:'Observação',value:'Guardado do caixa do dia',w:'half'}],
    v=>{const x=num(v.valor);if(!x){toast('Informe o valor',{icon:'alert'});return false;}const neg=v.tipo.startsWith('Retirar');
      snap();S.reserva.push({id:uid('r'),date:v.date||TODAY,valor:neg?-Math.abs(x):Math.abs(x),obs:v.obs||(neg?'Retirada':'Guardado do caixa do dia')});commit(neg?'Retirada registrada':fR2(Math.abs(x))+' guardado na reserva');});}
Object.assign(A,{guardar:()=>{closeModal();guardarModal();},delRes:t=>{snap();S.reserva=S.reserva.filter(r=>r.id!==t.dataset.id);commit('Movimento excluído');}});

Object.assign(A,{
  agView:t=>{U.agView=t.dataset.v;render();},agHoje:()=>{U.dia=TODAY;render();},
  agNav:t=>{U.dia=addD(U.dia,(U.agView==='semana'?7:1)*(+t.dataset.n));if(pD(U.dia).getDay()===0&&U.agView!=='semana')U.dia=addD(U.dia,+t.dataset.n);render();},
  pickDia:t=>{U.dia=t.dataset.d;if(t.dataset.v)U.agView=t.dataset.v;render();},
  mmNav:t=>{const d=pD(U.dia);d.setDate(1);d.setMonth(d.getMonth()+(+t.dataset.n));U.dia=isoD(d);render();},
  slot:(t,e)=>{const r=t.getBoundingClientRect();let m=ABRE+Math.floor((e.clientY-r.top)/PXM/15)*15;m=Math.max(ABRE,Math.min(ULT-15,m));agModal(null,{date:U.dia,hora:m2hm(m),barbeiroId:t.dataset.b});},
  newAg:()=>agModal(null,{date:U.dia<TODAY?TODAY:U.dia}),openAg:t=>{closeModal();agModal(S.agenda.find(g=>g.id===t.dataset.id));},
  concluirAg:t=>{const g=S.agenda.find(x=>x.id===t.dataset.id);closeModal();concluirModal(g);},
  faltouAg:t=>{const g=S.agenda.find(x=>x.id===t.dataset.id);closeModal();snap();g.status='Faltou';commit(g.cliente+' marcado como falta');},
  delAg:t=>{closeModal();confirmDlg('Excluir este agendamento?',()=>{snap();S.agenda=S.agenda.filter(g=>g.id!==t.dataset.id);commit('Agendamento excluído');},'Excluir');}
});

function renderBell(){const a=alerts(),b=$('#bell'),r=$('#bellBtn').getBoundingClientRect();b.style.top=(r.bottom+8)+'px';b.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  b.innerHTML='<div class="bsec">Alertas ('+a.length+')</div>'+(a.map(x=>`<button class="bitem" data-act="${x.act}" data-id="${x.id||''}" data-tab="${x.tab||''}">${ic(x.lvl==='db'?'alert':'clock')}<span><b class="${x.lvl}">${esc(x.t)}</b><span class="sub2">${esc(x.s)}</span></span></button>`).join('')||empty('Nenhuma pendência.'));}
document.addEventListener('click',e=>{const bell=$('#bell');if(bell.classList.contains('on')&&!e.target.closest('#bell')&&!e.target.closest('#bellBtn'))bell.classList.remove('on');
  const t=e.target.closest('[data-act]');if(t&&!t.disabled){if(t.closest('#bell'))bell.classList.remove('on');const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e);}return;}
  if(e.target.id==='modal'&&MDT===e.target)closeModal();});
let MDT=null;document.addEventListener('mousedown',e=>{MDT=e.target;});
document.addEventListener('change',e=>{const t=e.target;if(t.closest('#mform')){if(MOD&&MOD.onInput)MOD.onInput();return;}
  if(t.dataset.serv){const s=IX.s[t.dataset.serv];snap();s[t.dataset.f]=num(t.value);commit('Serviço atualizado');return;}
  if(t.dataset.prod){const p=IX.p[t.dataset.prod];snap();p[t.dataset.f]=num(t.value);commit('Produto atualizado');return;}
  if(t.dataset.com){const b=IX.b[t.dataset.com];snap();b.com=num(t.value)/100;commit('Comissão de '+b.nome+' atualizada');return;}
  const c=t.closest('[data-ch]');if(c&&C[c.dataset.ch])C[c.dataset.ch](c);});
document.addEventListener('input',e=>{if(e.target.closest('#mform')&&MOD&&MOD.onInput)MOD.onInput();});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='mform'&&MOD&&MOD.onSave){if(MOD.onSave())closeModal();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else $('#bell').classList.remove('on');}});

if(window.Chart){Chart.defaults.color='#8FA3B8';Chart.defaults.font.family="'IBM Plex Mono',ui-monospace,Consolas,monospace";Chart.defaults.font.size=10.5;
  Chart.defaults.borderColor='rgba(35,54,74,.7)';Chart.defaults.plugins.legend.labels.boxWidth=10;Chart.defaults.plugins.legend.labels.boxHeight=10;
  Chart.defaults.plugins.tooltip.backgroundColor='#0F1927';Chart.defaults.plugins.tooltip.borderColor='#23364A';Chart.defaults.plugins.tooltip.borderWidth=1;}
render();

</script>
</body>
</html>
