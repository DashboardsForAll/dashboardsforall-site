<style>
:root{
  --ink:#0C1420;--panel:#131F2E;--panel2:#0F1927;--panel3:#182839;--line:#23364A;--line2:#30475F;
  --text:#E8EDF3;--muted:#8FA3B8;--faint:#5E7288;
  --verde:#3FB68B;--vermelho:#E2694E;--ambar:#E8B94A;--aco:#5B9BD5;--roxo:#B07CC6;--teal:#59C3CE;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --title:'Archivo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--ink);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--aco)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
::selection{background:rgba(63,182,139,.35)}
.mono{font-family:var(--mono)}
.faint{color:var(--faint)}.muted{color:var(--muted)}
.pos,.cr{color:var(--verde)}.neg,.db{color:var(--vermelho)}.am{color:var(--ambar)}.az{color:var(--aco)}.rx{color:var(--roxo)}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2.5px}
.ic.lg{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cabeçalho ---------- */
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101C2B,var(--ink))}
.hi{max-width:1500px;margin:0 auto;padding:20px 26px 0}
.brow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.bmark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--verde),#1E7A5C);display:grid;place-items:center;font-family:var(--title);font-weight:800;font-size:18px;color:#07110C;flex:none}
.brand h1{font-family:var(--title);font-weight:800;font-size:22px;letter-spacing:-.4px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.hact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;padding:7px 10px;min-width:220px;font-size:12.5px}
.hsearch:hover{border-color:var(--faint);color:var(--text)}
.hsearch span{flex:1;text-align:left}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.who{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.ibtn{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.ibtn:hover{color:var(--text);border-color:var(--faint)}
.ibtn.on{color:var(--verde);border-color:rgba(63,182,139,.6);background:rgba(63,182,139,.1)}
.ibtn.sm{width:28px;height:28px;border-radius:7px}
.ibtn.sm .ic{width:13px;height:13px}
.badge[hidden]{display:none}
.syncchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
.syncchip[hidden]{display:none}
.syncchip:hover{color:var(--text);border-color:var(--faint)}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.syncchip .ic{width:14px;height:14px}
.syncchip.ok i{background:var(--verde)}
.syncchip.wait i{background:var(--ambar);animation:blink 1s ease-in-out infinite}
.syncchip.bad{color:var(--vermelho);border-color:rgba(226,105,78,.5)}
.syncchip.bad i{background:var(--vermelho)}
@keyframes blink{50%{opacity:.3}}
.syncbox{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:12px;background:var(--panel2);font-size:12.5px;line-height:1.6}
.syncbox.on{border-color:rgba(63,182,139,.45)}
.syncbox h4{font-family:var(--title);font-size:13.5px;display:flex;gap:7px;align-items:center;margin-bottom:6px}
.syncbox h4 .ic{color:var(--verde)}
.steps{margin:8px 0 4px 18px;font-size:12.3px}
.steps li{margin:3px 0}
details.adv{margin-top:12px;font-size:12.5px}
details.adv summary{cursor:pointer;color:var(--muted);font-weight:600}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--vermelho);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid var(--ink)}

.ledger{margin-top:16px;border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;background:var(--panel2);overflow-x:auto}
.li{display:flex;min-width:980px}
.lc{flex:1;padding:11px 16px 9px;border-right:1px dashed var(--line);text-align:left}
.lc:last-child{border-right:none}
button.lc:hover{background:rgba(35,54,74,.35)}
.lc .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.lc .val{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.lc .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap}

nav.tabs{position:sticky;top:0;z-index:60;background:rgba(12,20,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ni{max-width:1500px;margin:0 auto;padding:0 26px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ni::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--title);font-weight:700;font-size:13px;padding:13px 13px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tb:hover{color:var(--text)}
.tb.on{color:var(--text);border-bottom-color:var(--verde)}
.tb .n{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted)}
.tb .n.r{background:rgba(226,105,78,.2);color:var(--vermelho)}

main{max-width:1500px;margin:0 auto;padding:16px 26px 70px}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:11px}
.fi{max-width:1500px;margin:0 auto;padding:14px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono)}
.fi button{color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:11px}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.2}

.btn.lost{background:rgba(226,105,78,.12);border-color:rgba(226,105,78,.45);color:var(--vermelho)}
.btn.dan{color:var(--vermelho)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px;min-width:0}
.in:hover{border-color:var(--line2)}
.in:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px rgba(63,182,139,.15)}
.in.sm{padding:4px 7px;font-size:12px;border-radius:7px}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip.on{background:rgba(63,182,139,.16);border-color:var(--verde);color:var(--verde);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--panel3);color:var(--text)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar .grow{flex:1}
.srch{position:relative;display:flex;align-items:center;min-width:200px;flex:0 1 280px}
.srch .ic{position:absolute;left:10px;color:var(--faint);pointer-events:none}
.srch .in{width:100%;padding-left:31px}
.flab{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.psum{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin:-2px 0 12px}
.psum b{color:var(--text);font-weight:600}
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.15s}
.sw input:checked+span{background:rgba(63,182,139,.45)}
.sw input:checked+span::before{transform:translateX(15px);background:var(--verde)}
.sw input:focus-visible+span{outline:2px solid var(--verde);outline-offset:2px}

/* ---------- grade e cartões ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;min-width:0}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}
@media(max-width:1100px){.c2,.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}}
@media(max-width:560px){.c2,.c3{grid-column:span 12}}
.card h3{font-family:var(--title);font-weight:700;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.card .hint{font-size:11px;color:var(--faint);margin-bottom:11px}
.card .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card .hrow .hint{margin-bottom:0}
.box{position:relative;height:280px}.box.tall{height:340px}.box.short{height:220px}
.kpi .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .dl{font-family:var(--mono);font-size:11px;margin-top:4px;color:var(--muted)}
.gb{height:7px;border-radius:99px;background:var(--panel2);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.gb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ambar),var(--verde))}
.gb.r i{background:var(--vermelho)}
.dax{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--verde);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75}
.dax p+p{margin-top:8px}
.dax b{font-family:var(--mono);font-weight:600}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:12.5px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--text)}

.tw{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}

.tw.max{max-height:calc(100vh - 290px)}
.lnk{color:var(--text);font-weight:600;text-align:left}
.lnk:hover{color:var(--verde);text-decoration:underline}
.sub2{display:block;font-size:11px;color:var(--faint);font-weight:400}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap}
.bA{background:rgba(63,182,139,.16);color:var(--verde)}
.bB{background:rgba(232,185,74,.16);color:var(--ambar)}
.bC{background:rgba(226,105,78,.16);color:var(--vermelho)}
.bN{background:rgba(91,155,213,.16);color:var(--aco)}
.bP{background:rgba(176,124,198,.18);color:var(--roxo)}
.bG{background:rgba(143,163,184,.14);color:var(--muted)}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:1px 7px 1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap}
.tg i{width:7px;height:7px;border-radius:50%;display:inline-block}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--mono);font-size:9.5px;font-weight:600;color:#07110C;flex:none}

.av.none{background:var(--panel3);color:var(--faint);border:1px dashed var(--line2)}
.who-cell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* ---------- kanban ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-behavior:auto}
.col{flex:0 0 272px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:260px;transition:border-color .12s,background .12s}

.colt .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--panel3);padding:1px 7px;border-radius:99px}

.colbar{height:4px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}

.qadd{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line2);border-radius:9px;padding:8px;color:var(--faint);font-size:12px;font-weight:600}

.dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:border-color .12s,transform .12s}

.dcard.lost{border-left:3px solid var(--faint);opacity:.75}

.dtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dt{font-weight:600;font-size:12.8px;line-height:1.35}

.dtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.dmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}

.dicons{display:flex;align-items:center;gap:5px}
.dfoot{display:flex;justify-content:space-between;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:10.3px;color:var(--muted)}

.hs{font-family:var(--mono);font-size:10px;font-weight:600;border-radius:6px;padding:1px 5px;flex:none}
.hs.hA{background:rgba(63,182,139,.16);color:var(--verde)}
.hs.hB{background:rgba(232,185,74,.16);color:var(--ambar)}
.hs.hC{background:rgba(226,105,78,.16);color:var(--vermelho)}
.ast{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);color:var(--muted)}
.ast .ic{width:12px;height:12px}

.pct{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ambar);border:1px solid var(--ambar);border-radius:5px;padding:0 4px}
.dghost{position:fixed;z-index:400;pointer-events:none;width:252px;transform:rotate(2.5deg);box-shadow:0 18px 40px rgba(0,0,0,.55);border-color:var(--verde)!important;opacity:.96}
body.dragmode{cursor:grabbing!important;user-select:none}
body.dragmode *{cursor:grabbing!important}
.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:none;gap:10px;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(12,20,32,0),rgba(12,20,32,.96) 35%)}

.dz{flex:1;max-width:340px;margin:0 auto;height:62px;border:2px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--title);font-weight:700;font-size:13.5px;color:var(--muted);background:var(--panel2);transition:.12s}

.aty input{position:absolute;opacity:0;pointer-events:none}

.aty input:checked+span{border-color:var(--verde);color:var(--verde);background:rgba(63,182,139,.1)}

.alist{list-style:none;margin-top:10px}

  S.users.forEach(u=>IX.user[u.id]=u);

  S.products.forEach(p=>IX.prod[p.id]=p);

  S.notes.forEach(n=>(IX.notesByDeal[n.dealId]=IX.notesByDeal[n.dealId]||[]).push(n));
  S.deals.forEach(d=>{if(d.orgId)(IX.dealsByOrg[d.orgId]=IX.dealsByOrg[d.orgId]||[]).push(d);
    if(d.personId)(IX.dealsByPerson[d.personId]=IX.dealsByPerson[d.personId]||[]).push(d);});

/* ---------------- métricas por negócio ---------------- */
function st(d){const x=IX.stage[d.stageId];if(x)return x;const p=IX.pipe[d.pipeId]||S.pipes[0];return {s:p.stages[0],i:0,p};}
function prob(d){if(d.status==='won')return 1;if(d.status==='lost')return 0;return (d.prob!=null&&d.prob!==''?+d.prob:st(d).s.prob)/100;}
function dInStage(d){return Math.max(0,dd(d.stageAt,d.status==='open'?TODAY:(d.closedAt||TODAY)));}
function rotting(d){const s=st(d).s;return d.status==='open'&&s.rot>0&&dInStage(d)>s.rot;}
const byDue=(a,b)=>(a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99'));
function openActs(d){return (IX.actsByDeal[d.id]||[]).filter(a=>!a.done).sort(byDue);}
function nextAct(d){return openActs(d)[0];}
function actState(d){const a=nextAct(d);if(!a)return 'none';const n=dd(TODAY,a.due);return n<0?'over':n===0?'today':'fut';}
function lastTouch(d){let m=d.created;(IX.actsByDeal[d.id]||[]).forEach(a=>{if(a.done&&a.doneAt&&a.doneAt>m)m=a.doneAt;});return m;}
const lineTot=l=>(+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100)*(l.rec?(+l.months||12):1);
const dealMRR=d=>sum((d.items||[]).filter(l=>l.rec),l=>(+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100));
function syncValue(d){if(d.items&&d.items.length)d.value=Math.round(sum(d.items,lineTot));}
const maxDisc=d=>Math.max(0,...(d.items||[]).map(l=>+l.disc||0));
const needsApproval=d=>d.status==='open'&&maxDisc(d)>S.cfg.maxDisc&&!d.discOk;
const fcCat=d=>{const p=prob(d);return p>=.7?'commit':p>=.4?'best':'pipe';};
const FC={commit:{n:'Compromisso',c:COLORS.verde},best:{n:'Melhor cenário',c:COLORS.aco},pipe:{n:'Pipeline',c:COLORS.cinza}};

function health(d){
  if(d.status!=='open')return null;
  const f=[];let v=25;
  const ps=Math.round(prob(d)*40);f.push(['Etapa e probabilidade ('+fP(prob(d),0)+')',ps]);v+=ps;
  const lt=dd(lastTouch(d),TODAY);
  if(lt<=7){f.push(['Interação nos últimos 7 dias',15]);v+=15;}
  else if(lt<=14){f.push(['Interação nos últimos 14 dias',7]);v+=7;}
  else if(lt>30){f.push(['Sem interação há '+lt+' dias',-12]);v-=12;}
  const as=actState(d);
  if(as==='fut'||as==='today'){f.push(['Próxima atividade agendada',10]);v+=10;}
  else if(as==='over'){f.push(['Atividade atrasada',-10]);v-=10;}
  else{f.push(['Sem próxima atividade',-15]);v-=15;}
  if(rotting(d)){f.push(['Parado na etapa há '+dInStage(d)+' dias',-12]);v-=12;}
  if(d.close&&d.close<TODAY){f.push(['Previsão de fechamento vencida',-8]);v-=8;}
  if(d.items&&d.items.length){f.push(['Produtos definidos',5]);v+=5;}
  if(d.cf&&d.cf.decisor==='Sim'){f.push(['Decisor envolvido',8]);v+=8;}
  if(d.tags.includes('Quente')){f.push(['Etiqueta “Quente”',5]);v+=5;}
  v=clamp(Math.round(v),0,100);
  return {v,f,lvl:v>=70?'A':v>=45?'B':'C'};
}
function leadScore(l){
  const fit={Grande:30,'Média':20,Pequena:10}[l.size]||10;
  const src={'Indicação':25,'Parceiro':20,'Inbound (site)':18,'Evento / feira':14,'LinkedIn':12,'Google Ads':10,'Prospecção ativa':6}[l.source]||8;
  const comp=(l.email&&l.phone)?5:0;
  return clamp(fit+src+(+l.eng||0)+comp,0,100);
}
const scoreLvl=v=>v>=70?'A':v>=45?'B':'C';

function stageDays(d){
  const ev=[];d.hist.forEach(h=>{if(h.t==='created')ev.push([h.ts.slice(0,10),h.to]);else if(h.t==='stage')ev.push([h.ts.slice(0,10),h.to]);});
  const out={};const end=d.status==='open'?TODAY:(d.closedAt||TODAY);
  ev.forEach((e,i)=>{const nx=i<ev.length-1?ev[i+1][0]:end;out[e[1]]=(out[e[1]]||0)+Math.max(0,dd(e[0],nx));});
  return out;
}

/* ---------------- mutações comuns ---------------- */
function hist(d,t,x){d.hist.push(Object.assign({ts:nowTs(),t},x||{}));}
function newAct(o){const a=Object.assign({id:uid('a'),type:'task',subject:'',dealId:null,personId:null,ownerId:S.users[0].id,due:TODAY,time:'',done:false,doneAt:null,note:''},o);S.acts.push(a);return a;}
function hasOpenAct(dealId,subject){return S.acts.some(a=>a.dealId===dealId&&!a.done&&a.subject===subject);}

/* motor de automações (gatilho → condição → ação) */
function fire(trigger,d){
  const out=[];
  S.autos.forEach(a=>{
    if(!a.on||a.trigger!==trigger)return;
    if(a.pipeId&&a.pipeId!==d.pipeId)return;
    if(trigger==='stage'&&a.stageId&&a.stageId!==d.stageId)return;
    if(trigger==='lost'&&a.reason&&a.reason!==d.lostReason)return;
    if(a.minValue&&(d.value||0)<a.minValue)return;
    let text='';
    if(a.action==='activity'){
      if(hasOpenAct(d.id,a.subject))return;
      newAct({type:a.actType||'task',subject:a.subject||'Atividade automática',dealId:d.id,personId:d.personId,ownerId:d.ownerId,due:addD(TODAY,+a.days||0)});
      text='Atividade “'+(a.subject||'')+'” criada para '+rel(addD(TODAY,+a.days||0));
    }else if(a.action==='tag'){
      if(!a.tag||d.tags.includes(a.tag))return;d.tags.push(a.tag);text='Etiqueta “'+a.tag+'” adicionada';
    }else if(a.action==='owner'){
      if(!a.ownerId||d.ownerId===a.ownerId)return;d.ownerId=a.ownerId;text='Responsável alterado para '+((S.users.find(u=>u.id===a.ownerId)||{}).name||'—');
    }else if(a.action==='prob'){
      d.prob=+a.prob;text='Probabilidade definida em '+a.prob+'%';
    }else if(a.action==='notify'){
      S.notifs.unshift({id:uid('nt'),ts:nowTs(),text:(a.text||a.name)+' — '+d.title,dealId:d.id,read:false});text='Gestor notificado';
    }
    a.runs=(a.runs||0)+1;
    S.log.unshift({ts:nowTs(),autoId:a.id,dealId:d.id,text});
    hist(d,'auto',{name:a.name,text});
    out.push(a.name);
  });
  if(S.log.length>200)S.log.length=200;
  return out;
}

function moveStage(d,sid){
  if(d.stageId===sid&&d.status==='open')return;
  snap();
  const from=d.stageId;
  if(d.status!=='open'){d.status='open';d.closedAt=null;d.lostReason=null;hist(d,'reopen');}
  const np=IX.stage[sid];
  if(np&&np.p.id!==d.pipeId)d.pipeId=np.p.id;
  d.stageId=sid;d.stageAt=TODAY;d.prob=null;
  hist(d,'stage',{from,to:sid});
  const ran=fire('stage',d);
  commit();
  toast('“'+d.title+'” → '+(np?np.s.name:''),{undo:true,auto:ran});
}
function markWon(d){
  if(d.status==='won')return;
  snap();d.status='won';d.closedAt=TODAY;d.lostReason=null;hist(d,'won');
  const ran=fire('won',d);commit();
  toast('Negócio ganho: '+d.title+' ('+fR(d.value)+')',{undo:true,icon:'trophy',auto:ran});
}
function markLost(d,reason,note){
  snap();d.status='lost';d.closedAt=TODAY;d.lostReason=reason;d.lostNote=note||'';hist(d,'lost',{reason});
  const ran=fire('lost',d);commit();
  toast('Negócio marcado como perdido',{undo:true,icon:'x',auto:ran});
}
function reopen(d){snap();d.status='open';d.closedAt=null;d.lostReason=null;d.lostNote='';d.stageAt=TODAY;hist(d,'reopen');commit();toast('Negócio reaberto',{undo:true});}
function deleteDeals(ids){

const VIEWS={};
function filtDeals(o){
  o=o||{};const f=U.f,q=norm(f.q);
  const status=o.status||(U.view==='kanban'?'open':f.status);
  const pipe=o.pipe===undefined?U.pipe:o.pipe;
  const nm=ymAdd(CUR_YM,1);
  return S.deals.filter(d=>{
    if(pipe&&d.pipeId!==pipe)return false;
    if(!ownOK(d))return false;
    if(status!=='all'&&d.status!==status)return false;
    if(f.tag&&!d.tags.includes(f.tag))return false;
    if(f.src&&d.source!==f.src)return false;
    if(f.otype&&(f.otype==='__none'?orgTipo(d)!=='':orgTipo(d)!==f.otype))return false;
    if(f.close==='month'&&!(d.close&&d.close.slice(0,7)===CUR_YM))return false;
    if(f.close==='next'&&!(d.close&&d.close.slice(0,7)===nm))return false;
    if(f.close==='over'&&!(d.status==='open'&&d.close&&d.close<TODAY))return false;
    if(f.close==='none'&&d.close)return false;
    if(f.rot&&!rotting(d))return false;
    if(f.noact&&(d.status!=='open'||nextAct(d)))return false;
    if(q){const o2=IX.org[d.orgId],p=IX.person[d.personId];
      if(!norm(d.title+' '+(o2?o2.name:'')+' '+(p?p.name:'')+' '+d.tags.join(' ')).includes(q))return false;}
    return true;
  });
}
function activeFilters(){const f=U.f;return !!(f.q||f.tag||f.otype||f.src||f.close||f.rot||f.noact||(U.view==='list'&&f.status!=='open'));}

let CARD_TIPO=false; /* mostra o tipo de empresa no cartão quando o funil mistura tipos */
function boardHTML(deals){
  CARD_TIPO=new Set(deals.map(orgTipo)).size>1;
  const p=IX.pipe[U.pipe]||S.pipes[0];
  const by={};p.stages.forEach(s=>by[s.id]=[]);
  deals.forEach(d=>(by[d.stageId]||by[p.stages[0].id]).push(d));
  const totals=p.stages.map(s=>sum(by[s.id],d=>d.value));const mx=Math.max(1,...totals);
  return '<div class="board" id="board">'+p.stages.map((s,i)=>{
    const ds=by[s.id].sort((a,b)=>(a.close||'9999').localeCompare(b.close||'9999'));

    return `<section class="col" data-drop="stage" data-id="${s.id}" aria-label="${esc(s.name)}">

        <div class="cols">${fRs(totals[i])} <span class="faint">· pond. ${fRs(w)}</span></div>
        <div class="colbar"><i style="width:${(totals[i]/mx*100).toFixed(1)}%"></i></div>
        <div class="colp">${s.prob}% de probabilidade · ${s.rot?'parado após '+s.rot+'d':'sem alerta de parado'}</div></header>

        <button class="qadd" data-act="newDeal" data-stage="${s.id}">${ic('plus')}Negócio</button></div></section>`;}).join('')+'</div>';

const LCOLS=[['title','Negócio'],['org','Empresa'],['otype','Tipo de empresa'],['value','Valor','r'],['stage','Etapa'],['prob','Prob.','r'],['owner','Responsável'],['close','Previsão'],['next','Próxima atividade'],['health','Score','r'],['source','Origem'],['created','Criado'],['status','Status']];
function sortVal(d,k){switch(k){case 'org':return norm((IX.org[d.orgId]||{}).name);case 'otype':return norm(orgTipo(d))||'~';case 'stage':return st(d).i;case 'prob':return prob(d);

    deals.map(d=>{const o=IX.org[d.orgId],u=IX.user[d.ownerId],na=d.status==='open'?nextAct(d):null,h=health(d),as=d.status==='open'?actState(d):'';

/* =====================================================================
   Arrastar e soltar (mouse e toque) — Kanban e Previsão
   ===================================================================== */
const DG={on:false,id:null,el:null,ghost:null,sx:0,sy:0,ox:0,oy:0,timer:null,type:'',target:null,zone:null,suppress:false,lastX:0,lastY:0,raf:0};
document.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const card=e.target.closest('.dcard');if(!card||!card.closest('.board'))return;
  if(e.target.closest('button,a,input,select'))return;
  const r=card.getBoundingClientRect();
  Object.assign(DG,{id:card.dataset.deal,el:card,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,type:e.pointerType,on:false,lastX:e.clientX,lastY:e.clientY});
  clearTimeout(DG.timer);
  if(e.pointerType==='touch')DG.timer=setTimeout(()=>{if(DG.el&&!DG.on)startDrag();},280);
});
function startDrag(){
  DG.on=true;
  const g=DG.el.cloneNode(true);g.classList.add('dghost');g.style.width=DG.el.offsetWidth+'px';document.body.appendChild(g);DG.ghost=g;
  DG.el.classList.add('dragging');document.body.classList.add('dragmode');
  const d=getDeal(DG.id);
  $('#dropbar').classList.toggle('on',!!d);
  if(navigator.vibrate&&DG.type==='touch')try{navigator.vibrate(12);}catch(e){}
  moveGhost(DG.lastX,DG.lastY);loop();
}
function moveGhost(x,y){
  DG.lastX=x;DG.lastY=y;if(!DG.ghost)return;
  DG.ghost.style.left=(x-DG.ox)+'px';DG.ghost.style.top=(y-DG.oy)+'px';
  const under=document.elementFromPoint(x,y);
  const zone=under&&under.closest('.dz'),col=!zone&&under&&under.closest('[data-drop]');
  $$('.col.over').forEach(c=>{if(c!==col)c.classList.remove('over');});
  $$('.dz.over').forEach(z=>{if(z!==zone)z.classList.remove('over');});
  if(col)col.classList.add('over');if(zone)zone.classList.add('over');
  DG.target=col||null;DG.zone=zone?zone.dataset.zone:null;
}
function loop(){ /* rolagem automática perto das bordas */
  if(!DG.on)return;
  const b=$('#board'),m=60,x=DG.lastX,y=DG.lastY,W=window.innerWidth,H=window.innerHeight;
  if(b){if(x<m)b.scrollLeft-=14;else if(x>W-m)b.scrollLeft+=14;}
  if(y<90)window.scrollBy(0,-12);else if(y>H-110&&y<H-80)window.scrollBy(0,12);
  DG.raf=requestAnimationFrame(loop);
}
window.addEventListener('pointermove',e=>{
  if(!DG.el)return;
  if(!DG.on){
    const dist=Math.hypot(e.clientX-DG.sx,e.clientY-DG.sy);
    if(DG.type==='touch'){if(dist>8){clearTimeout(DG.timer);DG.el=null;}return;}
    if(dist>6){DG.lastX=e.clientX;DG.lastY=e.clientY;startDrag();}
    return;
  }
  e.preventDefault();moveGhost(e.clientX,e.clientY);
},{passive:false});
document.addEventListener('touchmove',e=>{if(DG.on)e.preventDefault();},{passive:false});
function endDrag(cancel){
  clearTimeout(DG.timer);cancelAnimationFrame(DG.raf);
  if(!DG.on){DG.el=null;return;}
  const id=DG.id,tgt=DG.target,zone=DG.zone;
  if(DG.ghost)DG.ghost.remove();if(DG.el)DG.el.classList.remove('dragging');

  Object.assign(DG,{on:false,el:null,ghost:null,target:null,zone:null,suppress:true});
  setTimeout(()=>DG.suppress=false,60);
  if(cancel)return;
  const d=getDeal(id);if(!d)return;
  if(zone==='won')return markWon(d);

  if(zone==='del')return confirmDlg('Excluir o negócio “'+d.title+'”? Atividades e notas vinculadas também serão removidas.',()=>deleteDeals([d.id]),'Excluir');

function moveClose(d,ymKey){

VIEWS.forecast=function(){

  const wonIn=m=>sum(won.filter(d=>d.closedAt&&d.closedAt.slice(0,7)===m),d=>d.value);
  const inM=m=>open.filter(d=>d.close&&d.close.slice(0,7)===m);

  $('#main').innerHTML=`
  <div class="tbar">

    <div class="card c3 kpi"><div class="lab">Compromisso do mês</div><div class="val cr">${fR(wCur+commitCm)}</div><div class="dl">ganho + negócios com probabilidade ≥ 70%</div></div>
    <div class="card c3 kpi"><div class="lab">Cobertura do gap da meta</div><div class="val ${cov>=3?'cr':cov>=1.5?'am':'db'}">${gap?fN(cov,1)+'×':'meta batida'}</div><div class="dl">pipeline ponderado ÷ ${fRs(gap)} restantes · ideal ≥ 3×</div></div>
    <div class="card"><div class="hrow"><div><h3>Receita realizada e prevista × meta</h3><div class="hint">Meses anteriores: ganho real · mês atual e futuros: ganho + pipeline ponderado por categoria de previsão</div></div></div>
      <div class="box"><canvas id="c-fc"></canvas></div></div>
  </div>
  <div style="height:14px"></div>
  <div class="board" id="board">

    ${fcCol('Sem data prevista','none',none,null,'')}
  </div>`;
  const labels=past.concat(months).map(ymLab);

  mkChart('c-fc',{type:'bar',data:{labels,datasets:[
    {label:'Ganho',data:all.map(wonIn),backgroundColor:'rgba(63,182,139,.9)',stack:'s',borderRadius:3},
    {label:'Compromisso (≥70%)',data:cat('commit'),backgroundColor:'rgba(63,182,139,.42)',stack:'s',borderRadius:3},
    {label:'Melhor cenário (40–69%)',data:cat('best'),backgroundColor:'rgba(91,155,213,.6)',stack:'s',borderRadius:3},
    {label:'Pipeline (<40%)',data:cat('pipe'),backgroundColor:'rgba(143,163,184,.35)',stack:'s',borderRadius:3},
    {label:'Meta',type:'line',data:all.map(()=>quota),borderColor:COLORS.ambar,borderDash:[6,4],borderWidth:2,pointRadius:0}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},

      scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>fRs(v)}}}}});

function fcCol(title,key,ds,wonV,sub){

function setDealField(d,k,v){
  snap();let label='',from='',to='';
  if(k==='title'){v=String(v).trim();if(!v||v===d.title)return;d.title=v;}
  else if(k==='value'){from=fR(d.value);d.value=Math.max(0,Math.round(+v||0));to=fR(d.value);label='Valor';}
  else if(k==='prob'){from=d.prob!=null?d.prob+'%':'padrão';d.prob=v===''?null:clamp(Math.round(+v),0,100);to=d.prob!=null?d.prob+'%':'padrão da etapa';label='Probabilidade';}
  else if(k==='close'){from=fD(d.close);d.close=v||null;to=fD(d.close);label='Previsão de fechamento';}
  else if(k==='ownerId'){from=(IX.user[d.ownerId]||{}).name;d.ownerId=v;to=(IX.user[v]||{}).name;label='Responsável';}
  else if(k==='source'){from=d.source;d.source=v;to=v;label='Origem';}
  else if(k==='pipeId'){if(v===d.pipeId)return;const np=S.pipes.find(p=>p.id===v);from=(IX.pipe[d.pipeId]||{}).name;d.pipeId=v;d.stageId=np.stages[0].id;d.stageAt=TODAY;d.prob=null;to=np.name;label='Funil';}
  else if(k==='orgId'){from=(IX.org[d.orgId]||{}).name;d.orgId=v||null;const ps=S.people.filter(p=>p.orgId===v);d.personId=ps[0]?ps[0].id:null;to=(IX.org[v]||{}).name;label='Empresa';}
  else if(k==='personId'){from=(IX.person[d.personId]||{}).name;d.personId=v||null;to=(IX.person[v]||{}).name;label='Contato';}
  else if(k==='org.tipo'){const o=S.orgs.find(x=>x.id===d.orgId);if(!o)return;from=o.tipo;o.tipo=v;to=v;label='Tipo de empresa';}
  else if(k.startsWith('cf.')){const f=S.fields.find(x=>x.id===k.slice(3));d.cf=d.cf||{};from=d.cf[k.slice(3)];d.cf[k.slice(3)]=v;to=v;label=f?f.name:k;}
  if(label)hist(d,'field',{k:label,from:from||'—',to:to||'—'});
  commit();
}

function repData(){
  const days=+U.rp.days,start=addD(TODAY,-days),p=IX.pipe[U.rp.pipe]||S.pipes[0];
  const deals=S.deals.filter(d=>d.pipeId===p.id&&ownOK(d));
  const closed=deals.filter(d=>d.status!=='open'&&d.closedAt>=start);
  const won=closed.filter(d=>d.status==='won'),lost=closed.filter(d=>d.status==='lost'),open=deals.filter(d=>d.status==='open');
  const created=deals.filter(d=>d.created>=start);
  const reached=p.stages.map((s,i)=>created.filter(d=>d.status==='won'||st(d).i>=i).length);
  const wonCreated=created.filter(d=>d.status==='won').length;
  const stageAvg=p.stages.map(s=>{let t=0,n=0;deals.forEach(d=>{if(d.created<addD(start,-120))return;
    const ev=[];d.hist.forEach(h=>{if(h.t==='created'||h.t==='stage')ev.push([h.ts.slice(0,10),h.to]);});
    ev.forEach((e,i)=>{if(e[1]!==s.id)return;let end=i<ev.length-1?ev[i+1][0]:(d.status!=='open'?d.closedAt:null);if(!end)return;t+=dd(e[0],end);n++;});});return n?t/n:0;});
  return {days,start,p,deals,closed,won,lost,open,created,reached,wonCreated,stageAvg,
    winRate:closed.length?won.length/closed.length:0,avgWon:won.length?sum(won,d=>d.value)/won.length:0,
    cycle:won.length?sum(won,d=>dd(d.created,d.closedAt))/won.length:0};
}
VIEWS.reports=function(){

  const quota=U.owner?(IX.user[U.owner]||{}).quota||0:sum(S.users,u=>+u.quota||0);
  const wonM=S.deals.filter(d=>d.status==='won'&&ownOK(d)&&d.closedAt&&d.closedAt.slice(0,7)===CUR_YM);
  const wv=sum(wonM,d=>d.value);
  const lr={};R.lost.forEach(d=>{const k=d.lostReason||'Não informado';lr[k]=lr[k]||{n:0,v:0};lr[k].n++;lr[k].v+=d.value;});
  const lrs=Object.keys(lr).sort((a,b)=>lr[b].n-lr[a].n);
  const conv=R.reached.map((n,i)=>i?(R.reached[i-1]?n/R.reached[i-1]:0):1);
  let worst=-1,wv2=2;conv.forEach((c,i)=>{if(i&&R.reached[i-1]>=4&&c<wv2){wv2=c;worst=i;}});
  const slow=R.stageAvg.indexOf(Math.max(...R.stageAvg));
  const team=S.users.filter(u=>!U.owner||u.id===U.owner).map(u=>{
    const ds=S.deals.filter(d=>d.ownerId===u.id),op=ds.filter(d=>d.status==='open');
    const cl=ds.filter(d=>d.status!=='open'&&d.closedAt>=R.start),wn=cl.filter(d=>d.status==='won');
    const wm=sum(ds.filter(d=>d.status==='won'&&d.closedAt&&d.closedAt.slice(0,7)===CUR_YM),d=>d.value);
    const ac=S.acts.filter(a=>a.ownerId===u.id&&a.done&&a.doneAt>=R.start).length;
    const ov=S.acts.filter(a=>a.ownerId===u.id&&!a.done&&a.due<TODAY).length;
    return {u,op:sum(op,d=>d.value),w:sum(op,d=>d.value*prob(d)),n:op.length,wm,att:u.quota?wm/u.quota:0,wr:cl.length?wn.length/cl.length:0,
      tk:wn.length?sum(wn,d=>d.value)/wn.length:0,cy:wn.length?sum(wn,d=>dd(d.created,d.closedAt))/wn.length:0,ac,ov};}).sort((a,b)=>b.wm-a.wm);

    worst>0?`Maior gargalo de conversão: a passagem de “${esc(p.stages[worst-1].name)}” para “${esc(p.stages[worst].name)}” converte apenas <b>${fP(conv[worst])}</b>.`:'',

    lead&&!U.owner?`Destaque do mês: <b>${esc(lead.u.name)}</b>, com ${fR(lead.wm)} ganhos (${fP(lead.att)} da meta individual).`:''].filter(Boolean);

function ruleDesc(a){
  const sn=id=>{const x=IX.stage[id];return x?x.s.name:'(etapa)';};
  const t=a.trigger==='stage'?TRIG.stage+' <span class="tg">'+esc(sn(a.stageId))+'</span>':a.trigger==='lost'?TRIG.lost+(a.reason?' por <span class="tg">'+esc(a.reason)+'</span>':''):TRIG[a.trigger];
  const c=[];if(a.minValue)c.push('valor ≥ '+fRs(a.minValue));if(a.pipeId)c.push('funil '+esc((IX.pipe[a.pipeId]||{}).name||''));
  let ac='';
  if(a.action==='activity')ac=ACTIONS.activity+' '+ic(ACT_T[a.actType||'task'].i)+' <b>“'+esc(a.subject)+'”</b> '+(+a.days?'em '+a.days+' dia(s)':'para hoje');
  else if(a.action==='tag')ac=ACTIONS.tag+' '+tagPill(a.tag||'');
  else if(a.action==='owner')ac=ACTIONS.owner+' <b>'+esc((IX.user[a.ownerId]||{}).name||'')+'</b>';
  else if(a.action==='prob')ac=ACTIONS.prob+' <b>'+a.prob+'%</b>';
  else ac=ACTIONS.notify+': “'+esc(a.text||'')+'”';
  return `<span class="kw">QUANDO</span> ${t}${c.length?' <span class="kw">E</span> '+c.join(' e '):''} <span class="kw">ENTÃO</span> ${ac}`;
}

function fieldHTML(f){

  if(f.type==='select')inp='<select class="in" id="'+id+'" name="'+f.k+'">'+opts(f.options,v)+'</select>';
  else if(f.type==='textarea')inp='<textarea class="in" id="'+id+'" name="'+f.k+'" rows="'+(f.rows||4)+'"'+(f.req?' required':'')+' placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  else if(f.type==='tags')inp='<div class="tagpick">'+S.tags.map(t=>'<label class="tgck"><input type="checkbox" name="'+f.k+'" value="'+esc(t.name)+'"'+chk((v||[]).includes(t.name))+'>'+tagPill(t.name)+'</label>').join('')+'</div>';
  else if(f.type==='check')inp='<label class="ck"><input type="checkbox" id="'+id+'" name="'+f.k+'"'+chk(v)+'> '+esc(f.text||'')+'</label>';
  else inp='<input class="in" id="'+id+'" name="'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(v)+'"'+(f.list?' list="'+f.list+'"':'')+(f.req?' required':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step?' step="'+f.step+'"':'')+' placeholder="'+esc(f.ph||'')+'" autocomplete="off">';
  return '<div class="fld'+(f.w?' '+f.w:'')+'" data-fk="'+f.k+'"'+(f.when?' data-when="'+esc(JSON.stringify(f.when))+'"':'')+'>'+(f.type==='check'?'':'<label for="'+id+'">'+esc(f.label)+'</label>')+inp+(f.help?'<div class="help">'+f.help+'</div>':'')+'</div>';

function formVals(){
  const fm=$('#mform'),v={};
  MOD.fields.forEach(f=>{if(f.type==='tags')v[f.k]=$$('input[name="'+f.k+'"]:checked',fm).map(x=>x.value);
    else if(f.type==='check')v[f.k]=!!(fm.elements[f.k]&&fm.elements[f.k].checked);
    else{const el=fm.elements[f.k];v[f.k]=el?String(el.value).trim():'';if(f.type==='number')v[f.k]=v[f.k]===''?'':+v[f.k];}});
  return v;
}
function formWhen(){ /* mostra/oculta campos condicionais */
  const fm=$('#mform');if(!fm)return;
  $$('[data-when]',fm).forEach(el=>{const w=JSON.parse(el.dataset.when),src=fm.elements[w[0]];const val=src?src.value:'';
    el.classList.toggle('hide',!(Array.isArray(w[1])?w[1].includes(val):val===w[1]));});
}

    {k:'close',label:'Previsão de fechamento',type:'date',value:pre.close||addD(TODAY,30),w:'half'},
    {k:'pipeId',label:'Funil',type:'select',options:S.pipes.map(x=>[x.id,x.name]),value:p.id,w:'half'},
    {k:'stageId',label:'Etapa',type:'select',options:p.stages.map(s=>[s.id,s.name]),value:pre.stageId||p.stages[0].id,w:'half'},
    {k:'ownerId',label:'Responsável',type:'select',options:S.users.map(u=>[u.id,u.name]),value:pre.ownerId||U.owner||S.users[0].id,w:'half'},
    {k:'source',label:'Origem',type:'select',options:S.sources,value:pre.source||S.sources[0],w:'half'},
    {k:'otype',label:'Tipo de empresa',list:'dl-otypes',value:pre.otype||'',ph:'Usado se a empresa ainda não tiver tipo'},
    {k:'tags',label:'Etiquetas',type:'tags',value:pre.tags||[]}],
    extra:dlOrgs()+dlPeople()+dlOtypes()+'<div id="dupwarn" style="flex:1 1 100%"></div>',
    onChange:(el)=>{
      if(el.name==='pipeId'){const np=IX.pipe[el.value];$('#f_stageId').innerHTML=opts(np.stages.map(s=>[s.id,s.name]),np.stages[0].id);}
      if(el.name==='org'){const o=S.orgs.find(x=>norm(x.name)===norm(el.value));const ex=o?S.deals.filter(d=>d.orgId===o.id&&d.status==='open'):[];
        $('#dupwarn').innerHTML=ex.length?'<div class="warnbox">'+ic('alert')+' Possível duplicidade: esta empresa já tem '+ex.length+' negócio(s) aberto(s) — '+ex.slice(0,3).map(d=>'“'+esc(d.title)+'”').join(', ')+'.</div>':'';}
    },
    onSave:v=>{
      if(!v.title){toast('Informe o título do negócio',{icon:'alert'});return false;}
      snap();
      const o=findOrCreateOrg(v.org);const pe=findOrCreatePerson(v.person,o?o.id:null,pre.personExtra);
      if(o&&v.otype&&!o.tipo)o.tipo=addOrgType(v.otype);
      const d={id:uid('d'),title:v.title,pipeId:v.pipeId,stageId:v.stageId,stageAt:TODAY,value:Math.max(0,+v.value||0),orgId:o?o.id:null,personId:pe?pe.id:null,
        ownerId:v.ownerId,source:v.source,tags:v.tags,close:v.close||null,created:TODAY,status:'open',closedAt:null,lostReason:null,lostNote:'',prob:null,items:[],discOk:false,cf:{},hist:[]};
      hist(d,'created',{to:v.stageId,lead:!!pre.leadId});
      S.deals.push(d);buildIx();
      const ran=fire('created',d);
      if(v.stageId!==IX.pipe[v.pipeId].stages[0].id)fire('stage',d);
      if(pre.leadId){const l=S.leads.find(x=>x.id===pre.leadId);if(l){l.status='convertido';S.leads=S.leads.filter(x=>x.id!==l.id);S.leadStats.conv++;}}
      closeModal();commit();openDeal(d.id,'acts');
      toast('Negócio criado: '+d.title,{undo:true,auto:ran});return true;
    }});
}

      if(!v.subject){toast('Informe o assunto',{icon:'alert'});return false;}
      snap();const d=getDeal(v.dealId);
      if(isNew)a=newAct({});
      Object.assign(a,{type:v.type,ownerId:v.ownerId,subject:v.subject,dealId:v.dealId||null,personId:d?d.personId:a.personId,due:v.due||TODAY,time:v.time,note:v.note});

/* ---------------- busca global ---------------- */
let SRI=0;
function openSearch(){
  MOD={search:true};
  modal('<div class="sh">'+ic('search','lg')+'<input class="in" id="sq" placeholder="Buscar negócios, pessoas, empresas e leads…" autocomplete="off" aria-label="Buscar"><kbd>Esc</kbd></div><div class="sres" id="sres"></div><div class="shint">↑ ↓ navegar · Enter abrir · Esc fechar</div>','search');
  searchRun('');
}
function searchRun(q){
  q=norm(q);const out=[];
  const add=(g,arr)=>{if(arr.length)out.push([g,arr]);};
  const m=s=>!q||norm(s).includes(q);
  add('Negócios',S.deals.filter(d=>m(d.title+' '+((IX.org[d.orgId]||{}).name||''))).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||b.value-a.value).slice(0,q?7:5)
    .map(d=>['deal',d.id,'kanban',d.title,fR(d.value)+' · '+st(d).s.name+(d.status!=='open'?' · '+(d.status==='won'?'ganho':'perdido'):'')]));
  if(q){
    add('Pessoas',S.people.filter(p=>m(p.name+' '+p.email)).slice(0,5).map(p=>['person',p.id,'user',p.name,(IX.org[p.orgId]||{}).name||'']));
    add('Empresas',S.orgs.filter(o=>m(o.name+' '+o.city)).slice(0,5).map(o=>['org',o.id,'building',o.name,[o.city,o.uf].filter(Boolean).join('/')]));
    add('Leads',S.leads.filter(l=>m(l.title+' '+l.person)).slice(0,4).map(l=>['lead',l.id,'inbox',l.title,l.person]));
  }
  SRI=0;let i=0;
  $('#sres').innerHTML=out.map(g=>'<h6>'+g[0]+'</h6>'+g[1].map(r=>'<button class="sri'+(i++===0?' on':'')+'" data-act="srOpen" data-t="'+r[0]+'" data-id="'+r[1]+'">'+ic(r[2])+'<span>'+esc(r[3])+'<span class="sub2">'+esc(r[4])+'</span></span></button>').join('')).join('')||'<div class="empty">Nada encontrado para “'+esc(q)+'”.</div>';
}

function alerts(){
  const open=S.deals.filter(d=>d.status==='open'&&ownOK(d));
  return {over:S.acts.filter(a=>!a.done&&a.due<TODAY&&ownOK(a)).sort(byDue),rot:open.filter(rotting).sort((a,b)=>dInStage(b)-dInStage(a)),
    noAct:open.filter(d=>!nextAct(d)),late:open.filter(d=>d.close&&d.close<TODAY),appr:open.filter(needsApproval),notif:S.notifs.filter(n=>!n.read)};
}
function renderBellBadge(){const a=alerts();const n=a.over.length+a.rot.length+a.appr.length+a.notif.length;const b=$('#bellN');b.hidden=!n;b.textContent=n>99?'99+':n;}
function renderBell(){
  const a=alerts(),el=$('#bell');
  const it=(icn,c,t,s,act,id)=>'<button class="bitem" data-act="'+act+'" data-id="'+id+'"><span class="'+c+'">'+ic(icn)+'</span><span>'+esc(t)+'<small>'+esc(s)+'</small></span></button>';
  const sec=(t,n,go,body)=>n?'<div class="bsec"><h6><span>'+t+' ('+n+')</span>'+(go?'<button class="lnk" style="font-size:10.5px;font-weight:500" data-act="ledgerGo" data-go="'+go+'">ver todos</button>':'')+'</h6>'+body+'</div>':'';
  el.innerHTML='<h4>Alertas do pipeline <button class="ibtn sm" data-act="bell" aria-label="Fechar">'+ic('x')+'</button></h4>'+
    sec('Notificações das automações',a.notif.length,'',a.notif.slice(0,5).map(n=>it('zap','am',n.text,fD(n.ts)+' '+n.ts.slice(11,16),'notifOpen',n.id)).join(''))+
    sec('Atividades atrasadas',a.over.length,'acts',a.over.slice(0,5).map(x=>it(ACT_T[x.type].i,'neg',x.subject,((getDeal(x.dealId)||{}).title||'')+' · '+rel(x.due),'openDeal',x.dealId)).join(''))+
    sec('Negócios parados',a.rot.length,'rot',a.rot.slice(0,5).map(d=>it('clock','neg',d.title,dInStage(d)+' dias em '+st(d).s.name,'openDeal',d.id)).join(''))+
    sec('Descontos aguardando aprovação',a.appr.length,'',a.appr.slice(0,5).map(d=>it('percent','am',d.title,maxDisc(d)+'% de desconto · '+fR(d.value),'openDeal',d.id)).join(''))+
    sec('Sem próxima atividade',a.noAct.length,'noact',a.noAct.slice(0,4).map(d=>it('alert','am',d.title,st(d).s.name+' · '+fR(d.value),'openDeal',d.id)).join(''))+
    sec('Previsão de fechamento vencida',a.late.length,'',a.late.slice(0,4).map(d=>it('flag','neg',d.title,'previsto para '+fD(d.close),'openDeal',d.id)).join(''))+
    (a.over.length+a.rot.length+a.noAct.length+a.late.length+a.appr.length+a.notif.length?'':'<div class="empty">Tudo em dia. Nenhum alerta. ✅</div>');
  const r=$('#bellBtn').getBoundingClientRect();el.style.top=(r.bottom+8)+'px';el.style.right=Math.max(10,window.innerWidth-r.right)+'px';
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const sep=first.split(';').length>=first.split(',').length?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const parseMoney=s=>{s=String(s||'').replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');return Math.max(0,parseFloat(s)||0);};

  if(ix.title<0&&ix.org<0){toast('Não encontrei as colunas “Título” ou “Empresa” no CSV',{icon:'alert'});return;}

    if(o&&g('otype')&&!o.tipo)o.tipo=addOrgType(g('otype'));
    const tags=g('tags').split(/[,|]/).map(x=>x.trim()).filter(Boolean);tags.forEach(t=>{if(!S.tags.some(x=>x.name===t))S.tags.push({name:t,color:'cinza'});});
    const src=g('source');if(src&&!S.sources.includes(src))S.sources.push(src);
    const d={id:uid('d'),title,pipeId:pipe.id,stageId:stage.id,stageAt:TODAY,value:parseMoney(g('value')),orgId:o?o.id:null,personId:pe?pe.id:null,ownerId:owner.id,source:src||S.sources[0],

/* =====================================================================
   BASE PRIVADA — dados reais publicados criptografados
   (AES-256-GCM com chave derivada da senha por PBKDF2-SHA256; conteúdo
   comprimido com gzip quando o navegador permite). A senha nunca sai do
   navegador; sem ela o arquivo é ilegível. Visitantes veem só a demo.
   A versão mais recente fica no branch de dados do GitHub (ver
   salvamento automático, abaixo); o arquivo ao lado da página é o ponto
   de partida quando a nuvem ainda não foi ativada.
   ===================================================================== */
const PRIV_FILE='base-privada.json', PRIV_ITER=600000;
const te=new TextEncoder(), td=new TextDecoder();
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64d(s){const b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function streamBytes(u8,tr){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(tr)).arrayBuffer());}
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
/* PK = chave da sessão {key: CryptoKey não exportável, salt (base64), iter} */
let PK=null;
async function newPK(pw){const salt=crypto.getRandomValues(new Uint8Array(16));return {key:await deriveKey(pw,salt,PRIV_ITER),salt:b64e(salt),iter:PRIV_ITER};}
async function pkFor(env,pw){return {key:await deriveKey(pw,b64d(env.salt),+env.iter||PRIV_ITER),salt:env.salt,iter:+env.iter||PRIV_ITER};}
async function encWith(pk,obj){
  let data=te.encode(JSON.stringify(obj)),zip=null;
  if(window.CompressionStream){try{data=await streamBytes(data,new CompressionStream('gzip'));zip='gzip';}catch(e){data=te.encode(JSON.stringify(obj));}}
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},pk.key,data);
  const env={app:'dfa-pipeline-crm',v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter:pk.iter,salt:pk.salt,iv:b64e(iv),data:b64e(new Uint8Array(ct)),savedAt:nowTs()};
  if(zip)env.zip=zip;
  return env;
}
async function decWith(pk,env){
  let pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},pk.key,b64d(env.data)));
  if(env.zip==='gzip'){
    if(!window.DecompressionStream)throw new Error('nozip');
    pt=await streamBytes(pt,new DecompressionStream('gzip'));
  }
  return JSON.parse(td.decode(pt));
}
const isEnc=o=>!!(o&&o.app==='dfa-pipeline-crm'&&o.data&&o.salt&&o.iv);

/* chave guardada no IndexedDB (não exportável) quando a base fica “aberta neste navegador” */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dfa-pipeline-crm',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbDo(mode,fn){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('k',mode),q=fn(t.objectStore('k'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});}catch(e){return null;}}
const idbSet=(k,v)=>idbDo('readwrite',s=>s.put(v,k));
const idbGet=k=>idbDo('readonly',s=>s.get(k));
const idbDel=k=>idbDo('readwrite',s=>s.delete(k));
function keepPK(){if(PK&&!NOPERSIST)idbSet('pk',PK);}

/* busca a versão mais recente: nuvem (branch de dados) e, se não houver, o arquivo do site */
async function fetchLatestEnv(){
  const cloud=await cloudGet(false).catch(()=>null);
  if(cloud&&cloud.env)return cloud;
  const r=await fetch(PRIV_FILE+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  return {env:await r.json(),sha:null,from:'site'};
}

/* =====================================================================
   SALVAMENTO AUTOMÁTICO NA NUVEM (GitHub)
   Cada alteração na base privada é criptografada no navegador e gravada,
   alguns segundos depois, em pipeline-vendas/base-privada.json do branch
   de dados (crm-dados) do repositório, pela API do GitHub, com um token
   de acesso restrito ao repositório. Outros aparelhos baixam a versão
   mais nova ao abrir a base ou voltar à aba; se dois aparelhos editarem
   ao mesmo tempo, o CRM pergunta qual versão manter.
   ===================================================================== */
const SYNC_DEF={owner:'DashboardsForAll',repo:'dashboardsforall-site',branch:'crm-dados',base:'main',path:'pipeline-vendas/base-privada.json'};
const MKEY='dfa-pipeline-crm-sync', SYNC_DELAY=4000;
function loadMeta(){try{return Object.assign({sha:null,at:null,dirty:false},JSON.parse(localStorage.getItem(MKEY)||'{}'));}catch(e){return {sha:null,at:null,dirty:false};}}
let SM=loadMeta(); /* {sha: versão da nuvem que este navegador conhece, at, dirty: alterações não enviadas} */
function saveMeta(){if(NOPERSIST)return;try{localStorage.setItem(MKEY,JSON.stringify(SM));}catch(e){}}
const SY={state:'off',msg:'',timer:null,busy:false,again:false,ver:0,lastPull:0,cur:null};
const syncCfg=()=>Object.assign({},SYNC_DEF,S.sync||{});
function syncOn(){return !isDemo()&&!!(S.sync&&S.sync.on&&S.sync.token);}
const encPath=p=>String(p).split('/').map(encodeURIComponent).join('/');
const repoPath=c=>'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo);
function stripSecrets(o){return o&&o.sync?Object.assign({},o,{sync:Object.assign({},o.sync,{token:'',on:false})}):o;}

async function gh(method,path,body,auth){
  const c=syncCfg(),h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(auth!==false&&c.token)h.Authorization='Bearer '+c.token;
  if(body)h['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  let j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,ok:r.ok,json:j};
}
function ghErr(r){
  const m=(r.json&&r.json.message)||'';
  if(r.status===401)return new Error('Token do GitHub inválido ou expirado. Confira o token ou gere um novo.');
  if(r.status===403&&/rate limit/i.test(m))return new Error('Limite de uso da API do GitHub atingido. Tente de novo em alguns minutos.');
  if(r.status===403)return new Error('O token não tem permissão de escrita neste repositório (Contents: Read and write).');
  if(r.status===404)return new Error('Repositório ou branch não encontrado. Confira se o token tem acesso a '+syncCfg().owner+'/'+syncCfg().repo+'.');
  return new Error('O GitHub respondeu '+r.status+(m?': '+m:'')+'.');
}
/* lê a versão da nuvem: {env, sha, from:'nuvem'} ou null se ainda não existe */
async function cloudGet(auth){
  const c=syncCfg();
  const r=await gh('GET',repoPath(c)+'/contents/'+encPath(c.path)+'?ref='+encodeURIComponent(c.branch),null,auth);
  if(r.status===404)return null;
  if(!r.ok)throw ghErr(r);
  let txt;
  if(r.json.encoding==='base64'&&r.json.content)txt=td.decode(b64d(r.json.content));
  else{const d=await fetch(r.json.download_url,{cache:'no-store'});txt=await d.text();}
  return {env:JSON.parse(txt),sha:r.json.sha,from:'nuvem'};
}
async function ensureBranch(){
  const c=syncCfg(),R=repoPath(c);
  let r=await gh('GET',R+'/git/ref/heads/'+encPath(c.branch));
  if(r.ok)return {created:false};
  if(r.status!==404)throw ghErr(r);
  r=await gh('GET',R+'/git/ref/heads/'+encPath(c.base));
  if(!r.ok)throw ghErr(r);
  const p=await gh('POST',R+'/git/refs',{ref:'refs/heads/'+c.branch,sha:r.json.object.sha});
  if(!p.ok&&p.status!==422)throw ghErr(p);
  return {created:p.ok};
}

/* ---------- estado e indicador ---------- */
function setSync(state,msg){SY.state=state;SY.msg=msg||'';renderSync();}
function syncStatusText(){
  const at=SM.at?' · '+fD(SM.at)+' '+SM.at.slice(11,16):'';
  return {idle:'Tudo salvo na nuvem'+at,pending:'Alterações aguardando salvamento…',saving:'Salvando na nuvem…',
    error:'Erro ao salvar: '+SY.msg,conflict:'Há uma versão mais nova na nuvem: escolha qual manter.',
    locked:SY.msg||'Digite a senha da base para retomar o salvamento automático.',off:'Salvamento automático desativado.'}[SY.state]||'';
}
function renderSync(){
  const el=$('#syncChip');if(!el)return;
  if(isDemo()){el.hidden=true;return;}
  el.hidden=false;
  const at=SM.at?SM.at.slice(11,16):'';
  const L={idle:['ok','Salvo'+(at?' · '+at:'')],pending:['wait','Não salvo'],saving:['wait','Salvando…'],error:['bad','Erro ao salvar'],
    conflict:['bad','Conflito'],locked:['wait','Senha necessária'],off:['','Nuvem desativada']}[SY.state]||['',''];
  el.className='syncchip '+L[0];el.innerHTML='<i></i>'+ic('cloud')+'<span>'+esc(L[1])+'</span>';
  el.title=syncStatusText();
  const st=$('#syncStatus');if(st)st.textContent=syncStatusText();
}
function syncReset(){clearTimeout(SY.timer);SY.timer=null;SM={sha:null,at:null,dirty:false};try{localStorage.removeItem(MKEY);}catch(e){}setSync('off');}
function syncAdopt(sha,fromCloud){
  clearTimeout(SY.timer);SY.timer=null;
  SM={sha:fromCloud?sha:null,at:fromCloud?nowTs():null,dirty:false};saveMeta();
  setSync(syncOn()?(PK?'idle':'locked'):'off');
}
function syncDirty(){
  if(isDemo())return;
  SY.ver++;SM.dirty=true;saveMeta();
  if(!syncOn())return;
  if(!PK){setSync('locked');return;}
  setSync('pending');syncPushSoon(SYNC_DELAY);
}
function syncPushSoon(ms){clearTimeout(SY.timer);SY.timer=setTimeout(()=>{SY.timer=null;syncPush();},ms);}

/* ---------- envio ---------- */
async function syncPush(opts){
  opts=opts||{};
  clearTimeout(SY.timer);SY.timer=null;
  if(!syncOn())return;
  if(!PK){setSync('locked');return;}
  if(SY.busy){SY.again=true;return;}
  SY.busy=true;setSync('saving');
  const ver=SY.ver;let conflictWith=null;
  try{
    const c=syncCfg();let sha=SM.sha;
    if(!sha||opts.overwrite){
      const ens=await ensureBranch();
      const cur=await cloudGet(true);
      if(cur&&!sha&&!ens.created&&!opts.overwrite)conflictWith=cur;
      sha=cur?cur.sha:null;
    }
    if(!conflictWith){
      const env=await encWith(PK,S);
      const body={message:'CRM: base privada atualizada em '+fD(TODAY)+' '+hm(),content:b64e(te.encode(JSON.stringify(env))),branch:c.branch};
      if(sha)body.sha=sha;
      const r=await gh('PUT',repoPath(c)+'/contents/'+encPath(c.path),body);
      if(r.ok){SM.sha=r.json.content.sha;SM.at=env.savedAt;if(SY.ver===ver)SM.dirty=false;saveMeta();setSync(SM.dirty?'pending':'idle');}
      else if(r.status===409||(r.status===422&&/sha/i.test((r.json&&r.json.message)||'')))conflictWith=await cloudGet(true);
      else throw ghErr(r);
    }
  }catch(e){setSync('error',e.message||String(e));}
  finally{SY.busy=false;}
  if(conflictWith)return syncConflict(conflictWith);
  if(SY.again||(SM.dirty&&SY.state==='pending')){SY.again=false;syncPushSoon(1500);}
}

/* ---------- recebimento ---------- */
async function syncPull(force){
  if(!syncOn()||!PK||SY.busy||SY.timer||SY.state==='conflict')return;
  if(!force&&Date.now()-SY.lastPull<20000)return;
  SY.lastPull=Date.now();
  let cur;try{cur=await cloudGet(true);}catch(e){setSync('error',e.message);return;}
  if(!cur||cur.sha===SM.sha){if(SY.state==='error')setSync(SM.dirty?'pending':'idle');return;}
  if(SM.dirty)return syncConflict(cur);
  await adoptCloud(cur);
}
async function adoptCloud(cur){
  if(!PK||cur.env.salt!==PK.salt){SY.cur=cur;setSync('locked','A senha foi trocada em outro aparelho: digite a nova senha.');return false;}
  let o;try{o=await decWith(PK,cur.env);}catch(e){setSync('error','não foi possível abrir a versão da nuvem.');return false;}
  S=Object.assign(genDemo(),o,{v:1,demo:false,touched:true});
  SM={sha:cur.sha,at:cur.env.savedAt||nowTs(),dirty:false};saveMeta();
  if(DR.open&&!getDeal(DR.id))closeDrawer();
  save();render();setSync('idle');
  toast('Base atualizada com a versão salva em outro aparelho',{icon:'refresh'});
  return true;
}
function syncConflict(cur){
  SY.cur=cur;setSync('conflict');
  const when=cur&&cur.env&&cur.env.savedAt?fD(cur.env.savedAt)+' às '+cur.env.savedAt.slice(11,16):'outro momento';
  MOD={priv:true};
  modal('<div class="mh"><h3>'+ic('alert')+' Versão mais nova na nuvem</h3><button class="ibtn sm" data-act="closeModal" aria-label="Fechar">'+ic('x')+'</button></div>'+
    '<div class="mb" style="font-size:13px;line-height:1.6"><p>A base foi salva em outro aparelho em <b>'+esc(when)+'</b>, depois da última sincronização deste navegador, e aqui também há alterações que ainda não foram salvas.</p>'+
    '<p style="margin-top:8px">Qual versão você quer manter?</p>'+
    '<div class="mfoot" style="flex-wrap:wrap"><button class="btn" data-act="syncTakeCloud">'+ic('download')+'Usar a versão da nuvem (descarta as alterações daqui)</button>'+
    '<button class="btn pri" data-act="syncKeepLocal">'+ic('upload')+'Manter a versão deste aparelho (substitui a da nuvem)</button></div></div>');
}

/* ---------- desbloqueio (sem chave na sessão) ---------- */
function unlockModal(){
  MOD={priv:true};
  modal('<div class="mh"><h3>'+ic('lock')+' Retomar salvamento automático</h3><button class="ibtn sm" data-act="closeModal" aria-label="Fechar">'+ic('x')+'</button></div>'+
    '<div class="mb"><p style="font-size:13px;line-height:1.6">'+esc(SY.msg||'Digite a senha da base para que as alterações voltem a ser salvas na nuvem.')+'</p>'+
    '<form data-form="syncUnlock" class="mf" style="padding:12px 0 0"><div class="fld"><label for="upw">Senha</label><input class="in" id="upw" name="pw" type="password" autocomplete="current-password" required></div>'+
    '<div id="privMsg" style="flex:1 1 100%"></div><div class="mfoot"><button class="btn pri" type="submit" id="privGo">'+ic('lock')+'Continuar</button></div></form></div>');
}
async function syncUnlock(pw){
  privBusy(true,'Verificando…');
  let got;
  try{got=SY.cur||await fetchLatestEnv();}catch(e){privBusy(false,'Continuar');privMsg('Não foi possível ler a base salva: '+(e.message||e));return;}
  let pk;try{pk=await pkFor(got.env,pw);await decWith(pk,got.env);}catch(e){privBusy(false,'Continuar');privMsg('Senha incorreta.');return;}
  PK=pk;keepPK();SY.cur=null;closeModal();
  if(got.from==='nuvem'&&got.sha!==SM.sha){if(SM.dirty)return syncConflict(got);await adoptCloud(got);return applyImports();}
  setSync(SM.dirty?'pending':'idle');if(SM.dirty)syncPush();
  applyImports();
}

/* ---------- configuração ---------- */
function syncSectionHTML(){
  const c=syncCfg();
  if(!syncOn())return `<div class="syncbox"><h4>${ic('cloud')} Salvamento automático na nuvem</h4>
    <p>Ative para que cada alteração seja salva sozinha, criptografada, no seu repositório do GitHub. Os outros aparelhos recebem a versão mais nova ao abrir a base. Sem isso, é preciso baixar e enviar o arquivo manualmente.</p>
    <ol class="steps"><li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> (token <i>fine-grained</i>).</li>
      <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque <b>${esc(c.repo)}</b>.</li>
      <li>Em <b>Permissions → Repository permissions → Contents</b>, escolha <b>Read and write</b>. Gere o token e copie.</li></ol>
    <form data-form="syncSetup" class="mf" style="padding:8px 0 0">
      <div class="fld"><label for="tk">Token do GitHub</label><input class="in mono" id="tk" name="token" type="password" autocomplete="off" placeholder="github_pat_…" required></div>
      ${PK?'':'<div class="fld"><label for="spw">Senha da base</label><input class="in" id="spw" name="pw" type="password" autocomplete="current-password" required><div class="help">Usada só neste navegador, para criptografar o que vai para a nuvem.</div></div>'}
      <details class="adv" style="flex:1 1 100%"><summary>Avançado: repositório e branch</summary><div class="mf" style="padding:10px 0 0">
        <div class="fld third"><label for="so">Dono</label><input class="in mono" id="so" name="owner" value="${esc(c.owner)}"></div>
        <div class="fld third"><label for="sr">Repositório</label><input class="in mono" id="sr" name="repo" value="${esc(c.repo)}"></div>
        <div class="fld third"><label for="sb">Branch de dados</label><input class="in mono" id="sb" name="branch" value="${esc(c.branch)}"></div></div></details>
      <div id="syncMsg" style="flex:1 1 100%"></div>
      <div class="mfoot"><button class="btn pri" type="submit" id="syncGo">${ic('cloud')}Ativar salvamento automático</button></div>
    </form></div>`;
  return `<div class="syncbox on"><h4>${ic('cloud')} Salvamento automático ativo</h4>
    <p id="syncStatus">${esc(syncStatusText())}</p>
    <p class="faint" style="font-size:11.5px">${esc(c.owner+'/'+c.repo)} · branch <span class="mono">${esc(c.branch)}</span> · <span class="mono">${esc(c.path)}</span></p>
    <div id="syncMsg"></div>
    <div class="mrow" style="margin-top:8px"><button class="btn sm" data-act="syncNow">${ic('upload')}Salvar agora</button><button class="btn sm" data-act="syncPullNow">${ic('download')}Buscar versão mais nova</button>
      <button class="btn sm ghost" data-act="syncToken">Trocar token</button><button class="btn sm dan" data-act="syncOff">Desativar</button></div></div>`;
}
function syncMsg(t,ok){const el=$('#syncMsg');if(el)el.innerHTML='<div class="'+(ok?'alertln ok':'warnbox')+'" style="margin:6px 0 0">'+esc(t)+'</div>';}
async function syncActivate(f){
  const token=f.elements.token.value.trim();
  if(!/^(github_pat_|ghp_|gho_|ghu_)[A-Za-z0-9_]{20,}$/.test(token))return syncMsg('Isso não parece um token do GitHub (começa com github_pat_).');
  const b=$('#syncGo');if(b)b.disabled=true;
  if(!PK){
    const pw=f.elements.pw.value;let got,pk;
    try{got=await fetchLatestEnv();pk=await pkFor(got.env,pw);await decWith(pk,got.env);}catch(e){if(b)b.disabled=false;return syncMsg('Senha incorreta ou base salva indisponível.');}
    PK=pk;keepPK();
  }
  const owner=(f.elements.owner.value||SYNC_DEF.owner).trim(),repo=(f.elements.repo.value||SYNC_DEF.repo).trim(),branch=(f.elements.branch.value||SYNC_DEF.branch).trim();
  S.sync={on:true,token,owner,repo,branch,base:SYNC_DEF.base,path:SYNC_DEF.path};
  syncMsg('Conectando ao GitHub…',true);
  const r=await gh('GET',repoPath(syncCfg()));
  if(!r.ok){S.sync.on=false;S.sync.token='';save();if(b)b.disabled=false;setSync('off');return syncMsg(ghErr(r).message);}
  SM.sha=null;SM.dirty=true;save();saveMeta();
  await syncPush({first:true});
  if(SY.state==='idle'){toast('Salvamento automático ativado',{icon:'cloud'});privModal(false);}
  else if(SY.state!=='conflict'){const m=SY.msg;S.sync.on=false;S.sync.token='';save();setSync('off');if(b)b.disabled=false;syncMsg(m||'Não foi possível salvar na nuvem.');}
}
Object.assign(A,{
  syncChip:()=>{if(SY.state==='locked')return unlockModal();if(SY.state==='conflict'&&SY.cur)return syncConflict(SY.cur);privModal(false);},
  syncNow:()=>{syncPush();},
  syncPullNow:async()=>{if(SM.dirty){syncMsg('Há alterações locais ainda não salvas. Use “Salvar agora” primeiro.');return;}SY.lastPull=0;await syncPull(true);if(SY.state==='idle')syncMsg('Você já está com a versão mais nova.',true);},
  syncOff:()=>confirmDlg('Desativar o salvamento automático? As alterações passam a ficar só neste navegador, e o token é apagado desta base.',()=>{
    snap();S.sync=Object.assign({},S.sync,{on:false,token:''});save();setSync('off');toast('Salvamento automático desativado',{icon:'cloud'});},'Desativar'),
  syncToken:()=>formModal({title:'Trocar token do GitHub',fields:[{k:'token',label:'Novo token (github_pat_…)',type:'password',req:true}],ok:'Salvar token',
    onSave:v=>{if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v.token)){toast('Isso não parece um token do GitHub',{icon:'alert'});return false;}
      S.sync=Object.assign({},S.sync,{token:v.token,on:true});save();closeModal();syncPush();return true;}}),
  syncTakeCloud:async()=>{const cur=SY.cur;closeModal();if(!cur)return;SM.dirty=false;await adoptCloud(cur);},
  syncKeepLocal:()=>{closeModal();SY.cur=null;syncPush({overwrite:true});}
});
document.addEventListener('submit',e=>{
  const k=e.target.dataset&&e.target.dataset.form;
  if(k==='syncSetup')syncActivate(e.target);
  else if(k==='syncUnlock')syncUnlock(e.target.elements.pw.value);
});
AFTER_COMMIT.push(syncDirty);
document.addEventListener('visibilitychange',()=>{
  if(!syncOn())return;
  if(document.visibilityState==='hidden'){if(SM.dirty&&PK)syncPush();}
  else syncPull(false);
});
setInterval(()=>{if(document.visibilityState==='visible')syncPull(false);},120000);
window.addEventListener('beforeunload',e=>{if(syncOn()&&(SM.dirty||SY.busy)){e.preventDefault();e.returnValue='';}});

/* =====================================================================
   PACOTES DE IMPORTAÇÃO — listas novas (ex.: planilhas de prospecção)
   publicadas criptografadas em importacoes.json, com a mesma chave da
   base. Quando a base privada é aberta, os pacotes ainda não aplicados
   são SOMADOS a ela (nada existente é sobrescrito) e salvos na nuvem.
   ===================================================================== */
const IMPORTS_FILE='importacoes.json';let IMPORT_WARNED=false,IMPORT_BUSY=false;
async function applyImports(){
  if(isDemo()||!PK||IMPORT_BUSY)return;
  IMPORT_BUSY=true;
  try{
    let list;try{const r=await fetch(IMPORTS_FILE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;list=await r.json();}catch(e){return;}
    const done=new Set(S.imports||[]);
    const pend=((list&&list.packs)||[]).filter(p=>p&&p.id&&!done.has(p.id)&&isEnc(p.env));
    const names=[];let snapped=false;
    for(const p of pend){
      if(p.env.salt!==PK.salt){if(!IMPORT_WARNED){IMPORT_WARNED=true;toast('Há uma importação pendente criptografada com outra senha: peça uma nova versão do pacote.',{icon:'alert'});}continue;}
      let pay;try{pay=await decWith(PK,p.env);}catch(e){continue;}
      if(!snapped){snap();snapped=true;}
      mergePack(pay);(S.imports=S.imports||[]).push(p.id);names.push(pay.title||p.id);
    }
    if(names.length){commit();toast('Importação aplicada à sua base: '+names.join(', '),{icon:'upload'});}
  }finally{IMPORT_BUSY=false;}
}
function mergePack(pay){
  ['pipes','orgs','people','deals','acts','notes','products','fields','templates','seqs','autos','views'].forEach(k=>{
    if(!Array.isArray(pay[k]))return;S[k]=S[k]||[];const have=new Set(S[k].map(x=>x.id));
    pay[k].forEach(x=>{if(x&&x.id&&!have.has(x.id)){S[k].push(x);have.add(x.id);}});});
  ['sources','lostReasons','orgTypes'].forEach(k=>{if(!Array.isArray(pay[k]))return;S[k]=S[k]||[];pay[k].forEach(v=>{if(!S[k].includes(v))S[k].push(v);});});
  (pay.tags||[]).forEach(t=>{if(!S.tags.some(x=>x.name===t.name))S.tags.push(t);});
  (pay.patch||[]).forEach(p=>{const o=(S[p.coll]||[]).find(x=>x.id===p.id);if(!o)return;
    if(p.ifEq&&Object.keys(p.ifEq).some(k=>o[k]!==p.ifEq[k]))return;
    Object.keys(p.set||{}).forEach(k=>{const cur=o[k];const empty=cur==null||cur===''||(Array.isArray(cur)&&!cur.length);if(!p.onlyIfEmpty||empty)o[k]=p.set[k];});});
}

/* =====================================================================
   Inicialização
   ===================================================================== */
(async function init(){
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))U.tab=h;
  render();
  if(isDemo())return;
  const k=await idbGet('pk');PK=k&&k.key?k:null;
  if(syncOn()){
    if(!PK)setSync('locked');
    else{setSync(SM.dirty?'pending':'idle');if(SM.dirty)syncPushSoon(800);else await syncPull(true);}
  }else setSync('off');
  applyImports();
})();
</script>
