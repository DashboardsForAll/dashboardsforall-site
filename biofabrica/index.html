<style>

:root{
  --ink:#0C1420;--panel:#131F2E;--panel2:#0F1927;--panel3:#182839;--line:#23364A;--line2:#30475F;
  --text:#E8EDF3;--muted:#8FA3B8;--faint:#5E7288;
  --verde:#3FB68B;--vermelho:#E2694E;--ambar:#E8B94A;--aco:#5B9BD5;--roxo:#B07CC6;--teal:#59C3CE;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --title:'Archivo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--ink);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--aco)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
::selection{background:rgba(63,182,139,.35)}
.mono{font-family:var(--mono)}
.faint{color:var(--faint)}.muted{color:var(--muted)}
.pos,.cr{color:var(--verde)}.neg,.db{color:var(--vermelho)}.am{color:var(--ambar)}.az{color:var(--aco)}.rx{color:var(--roxo)}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2.5px}
.ic.lg{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- cabeçalho ---------- */
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101C2B,var(--ink))}
.hi{max-width:1500px;margin:0 auto;padding:20px 26px 0}
.brow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.bmark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--verde),#1E7A5C);display:grid;place-items:center;font-family:var(--title);font-weight:800;font-size:18px;color:#07110C;flex:none}
.brand h1{font-family:var(--title);font-weight:800;font-size:22px;letter-spacing:-.4px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.hact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;padding:7px 10px;min-width:220px;font-size:12.5px}
.hsearch:hover{border-color:var(--faint);color:var(--text)}
.hsearch span{flex:1;text-align:left}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.who{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.ibtn{position:relative;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.ibtn:hover{color:var(--text);border-color:var(--faint)}
.ibtn.on{color:var(--verde);border-color:rgba(63,182,139,.6);background:rgba(63,182,139,.1)}
.ibtn.sm{width:28px;height:28px;border-radius:7px}
.ibtn.sm .ic{width:13px;height:13px}
.badge[hidden]{display:none}
.syncchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
.syncchip[hidden]{display:none}
.syncchip:hover{color:var(--text);border-color:var(--faint)}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.syncchip .ic{width:14px;height:14px}
.syncchip.ok i{background:var(--verde)}
.syncchip.wait i{background:var(--ambar);animation:blink 1s ease-in-out infinite}
.syncchip.bad{color:var(--vermelho);border-color:rgba(226,105,78,.5)}
.syncchip.bad i{background:var(--vermelho)}
@keyframes blink{50%{opacity:.3}}
.syncbox{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:12px;background:var(--panel2);font-size:12.5px;line-height:1.6}
.syncbox.on{border-color:rgba(63,182,139,.45)}
.syncbox h4{font-family:var(--title);font-size:13.5px;display:flex;gap:7px;align-items:center;margin-bottom:6px}
.syncbox h4 .ic{color:var(--verde)}
.steps{margin:8px 0 4px 18px;font-size:12.3px}
.steps li{margin:3px 0}
details.adv{margin-top:12px;font-size:12.5px}
details.adv summary{cursor:pointer;color:var(--muted);font-weight:600}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--vermelho);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;display:grid;place-items:center;border:2px solid var(--ink)}

.ledger{margin-top:16px;border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;background:var(--panel2);overflow-x:auto}
.li{display:flex;min-width:980px}
.lc{flex:1;padding:11px 16px 9px;border-right:1px dashed var(--line);text-align:left}
.lc:last-child{border-right:none}
button.lc:hover{background:rgba(35,54,74,.35)}
.lc .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.lc .val{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.lc .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap}

nav.tabs{position:sticky;top:0;z-index:60;background:rgba(12,20,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ni{max-width:1500px;margin:0 auto;padding:0 26px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ni::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--title);font-weight:700;font-size:13px;padding:13px 13px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tb:hover{color:var(--text)}
.tb.on{color:var(--text);border-bottom-color:var(--verde)}
.tb .n{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted)}
.tb .n.r{background:rgba(226,105,78,.2);color:var(--vermelho)}

main{max-width:1500px;margin:0 auto;padding:16px 26px 70px}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:11px}
.fi{max-width:1500px;margin:0 auto;padding:14px 26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono)}
.fi button{color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:11px}

/* ---------- controles ---------- */

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:99px;white-space:nowrap}

.chip.on{background:rgba(63,182,139,.16);border-color:var(--verde);color:var(--verde);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--panel3);color:var(--text)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar .grow{flex:1}
.srch{position:relative;display:flex;align-items:center;min-width:200px;flex:0 1 280px}
.srch .ic{position:absolute;left:10px;color:var(--faint);pointer-events:none}
.srch .in{width:100%;padding-left:31px}
.flab{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:600}
.psum{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin:-2px 0 12px}
.psum b{color:var(--text);font-weight:600}
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.15s}
.sw input:checked+span{background:rgba(63,182,139,.45)}
.sw input:checked+span::before{transform:translateX(15px);background:var(--verde)}
.sw input:focus-visible+span{outline:2px solid var(--verde);outline-offset:2px}

/* ---------- grade e cartões ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;min-width:0}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}

@media(max-width:560px){.c2,.c3{grid-column:span 12}}
.card h3{font-family:var(--title);font-weight:700;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:8px}

.card .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.box{position:relative;height:280px}.box.tall{height:340px}.box.short{height:220px}
.kpi .lab{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gb{height:7px;border-radius:99px;background:var(--panel2);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.gb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ambar),var(--verde))}

.dax{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--verde);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75}

.dax b{font-family:var(--mono);font-weight:600}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:12.5px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--text)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(35,54,74,.55);vertical-align:middle}

.tbl input[type=checkbox]{accent-color:var(--verde);width:15px;height:15px;cursor:pointer}
.tw{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}

.lnk{color:var(--text);font-weight:600;text-align:left}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap}
.bA{background:rgba(63,182,139,.16);color:var(--verde)}
.bB{background:rgba(232,185,74,.16);color:var(--ambar)}
.bC{background:rgba(226,105,78,.16);color:var(--vermelho)}
.bN{background:rgba(91,155,213,.16);color:var(--aco)}
.bP{background:rgba(176,124,198,.18);color:var(--roxo)}

.tg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:1px 7px 1px 6px;border-radius:99px;background:var(--panel3);color:var(--muted);white-space:nowrap}

.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--mono);font-size:9.5px;font-weight:600;color:#07110C;flex:none}

.av.none{background:var(--panel3);color:var(--faint);border:1px dashed var(--line2)}
.who-cell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* ---------- kanban ---------- */

.dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:border-color .12s,transform .12s}

.dt{font-weight:600;font-size:12.8px;line-height:1.35}

.hs{font-family:var(--mono);font-size:10px;font-weight:600;border-radius:6px;padding:1px 5px;flex:none}
.hs.hA{background:rgba(63,182,139,.16);color:var(--verde)}
.hs.hB{background:rgba(232,185,74,.16);color:var(--ambar)}

.ast{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);color:var(--muted)}

.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:300;display:none;gap:10px;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(12,20,32,0),rgba(12,20,32,.96) 35%)}

.dz{flex:1;max-width:340px;margin:0 auto;height:62px;border:2px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--title);font-weight:700;font-size:13.5px;color:var(--muted);background:var(--panel2);transition:.12s}

.ptable .in{width:100%}

.preview{background:var(--panel2);border:1px dashed var(--line2);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(5,10,16,.66);display:none;align-items:flex-start;justify-content:center;padding:6vh 12px 20px;overflow-y:auto}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(600px,100%);box-shadow:0 30px 70px rgba(0,0,0,.55);animation:pop .16s ease}
.mbox.wide{width:min(860px,100%)}
.mbox.search{width:min(640px,100%)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-family:var(--title);font-size:16px;font-weight:800}
.mb{padding:16px 18px}
.mf{display:flex;flex-wrap:wrap;gap:12px;padding:16px 18px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld.third{flex:1 1 calc(33% - 8px)}

.fld>label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld .in{width:100%}
.fld .help{font-size:11px;color:var(--faint)}
.fld.hide{display:none}
.mfoot{flex:1 1 100%;display:flex;justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}

.tagpick{display:flex;flex-wrap:wrap;gap:6px}

.ck{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}

.sres{max-height:56vh;overflow-y:auto;padding:6px}

/* ---------- notificações / toast ---------- */
.bell{position:fixed;z-index:150;width:min(400px,calc(100% - 20px));max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:13px;box-shadow:0 24px 60px rgba(0,0,0,.55);display:none}
.bell.on{display:block}
.bell h4{font-family:var(--title);font-size:14px;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bsec{padding:8px 8px 4px;border-bottom:1px solid var(--line)}
.bsec:last-child{border-bottom:none}
.bsec h6{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:3px 7px 5px}
.bitem{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:7px;border-radius:8px;font-size:12.3px;line-height:1.4}

.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 24px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#0F1927;border:1px solid var(--line2);border-radius:11px;padding:10px 14px;font-size:12.8px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:pop .18s ease;max-width:100%}

.toast button{color:var(--verde);font-weight:700;font-size:12.5px;white-space:nowrap}

let IX={},D={};
const byId=a=>Object.fromEntries(a.map(x=>[x.id,x]));
function compute(){
  IX={esp:byId(S.especies),cli:byId(S.clientes),prp:byId(S.propostas),prj:byId(S.projetos),mat:byId(S.matrizes),lot:byId(S.lotes),ins:byId(S.insumos)};
  /* repicagens: ciclo nº pela ordem de data dentro do lote */
  const rl={};S.reps.forEach(r=>(rl[r.loteId]=rl[r.loteId]||[]).push(r));
  const R={};
  Object.values(rl).forEach(a=>{a.sort((x,y)=>x.date.localeCompare(y.date));
    a.forEach((r,i)=>{const ger=Math.round(num(r.repicados)*num(r.taxa));const saldo=ger-num(r.perdas);R[r.id]={n:i+1,ger,saldo,seg:saldo-num(r.enraiz)};});});
  /* lotes */
  const L={};
  S.lotes.forEach(l=>{const m=IX.mat[l.matrizId];const e=m?IX.esp[m.especieId]:null;const a=rl[l.id]||[];const last=a[a.length-1];
    const est=l.fase==='Encerrado'?0:(last?R[last.id].seg:num(l.expl));
    const ger=sum(a,r=>R[r.id].ger),rep=sum(a,r=>num(r.repicados)),per=sum(a,r=>num(r.perdas));
    const prox=l.fase==='Multiplicação'?addD(last?last.date:l.inicio,e?num(e.dias):15):'';
    L[l.id]={esp:e,mat:m,reps:a,ciclos:a.length,last:last?last.date:'',est,env:sum(a,r=>num(r.enraiz)),per,ger,rep,
      fr:sum(a,r=>num(r.frascos)),saldoSum:sum(a,r=>R[r.id].saldo),taxa:rep?ger/rep:null,pperda:ger?per/ger:null,prox,
      alerta:!prox?'':prox<TODAY?'Atrasada':dd(TODAY,prox)<=7?'Nesta semana':''};});
  /* projetos: andamento e projeção */
  const P={};
  S.projetos.forEach(p=>{const pr=IX.prp[p.propostaId]||{};const e=IX.esp[pr.especieId];const c=IX.cli[pr.clienteId];
    const lots=S.lotes.filter(l=>l.projetoId===p.id);
    const plantas=sum(lots,l=>L[l.id].est),env=sum(lots,l=>L[l.id].env);
    const pa=e?num(e.perdaAclim):0,meta=num(pr.qtd);
    const prev=Math.round(env*(1-pa)),falta=Math.max(0,meta-prev);
    const repS=sum(lots,l=>L[l.id].rep),saldoS=sum(lots,l=>L[l.id].saldoSum);
    const taxa=repS?saldoS/repS:(e?num(e.taxa)*(1-num(e.perda)):null);
    let ciclos=null;
    if(falta===0)ciclos=0;else if(plantas>0&&taxa>1)ciclos=Math.max(0,Math.ceil(Math.log((falta/(1-pa))/plantas)/Math.log(taxa)-1e-9));
    const last=lots.map(l=>L[l.id].last).filter(Boolean).sort().pop()||'';
    const fim=['Entregue','Cancelado'].includes(p.status);
    const concl=(!fim&&ciclos!=null&&e)?addD(last||p.inicio,ciclos*num(e.dias)+num(e.enraiz)+num(e.aclim)):'';
    P[p.id]={pr,esp:e,cli:c,lots,meta,valor:meta*num(pr.preco),plantas,env,pa,prev,falta,pct:meta?Math.min(1,prev/meta):0,taxa,ciclos,last,concl,
      sit:concl&&pr.prazo?(concl>pr.prazo?'Atrasará':'No prazo'):'',ativo:!fim};});
  /* insumos */
  const I={};
  S.insumos.forEach(i=>{const m=S.movs.filter(v=>v.insumoId===i.id);
    const ent=sum(m.filter(v=>v.tipo==='Entrada'),v=>num(v.qtd)),sai=sum(m.filter(v=>v.tipo==='Saída'),v=>num(v.qtd)),sal=ent-sai;
    I[i.id]={ent,sai,saldo:sal,valor:sal*num(i.custo),sit:sal<=0?'Sem estoque':sal<num(i.min)?'Repor':'OK'};});
  /* custo por projeto: insumos consumidos + despesas diretas + rateio dos custos fixos por frasco */
  const pool=sum(S.fin.filter(entraRateio),f=>num(f.valor));
  const fr=sum(S.reps,r=>num(r.frascos)),cpf=fr?pool/fr:0;
  const C={};
  S.projetos.forEach(p=>{const pd=P[p.id];const ids=new Set(pd.lots.map(l=>l.id));
    const insv=sum(S.movs.filter(v=>v.tipo==='Saída'&&ids.has(v.loteId)),v=>num(v.qtd)*num((IX.ins[v.insumoId]||{}).custo));
    const dir=sum(S.fin.filter(f=>f.tipo==='Despesa'&&f.projetoId===p.id),f=>num(f.valor));
    const frp=sum(pd.lots,l=>L[l.id].fr),rat=frp*cpf,imp=pd.valor*num(S.cfg.aliq),tot=insv+dir+rat,liq=pd.valor-imp;
    C[p.id]={rec:pd.valor,imp,insv,dir,frp,rat,tot,unit:pd.meta?tot/pd.meta:null,cons:liq>0?tot/liq:null,res:liq-tot,marg:pd.valor?(liq-tot)/pd.valor:null};});
  D={R,L,P,I,C:{pool,fr,cpf,naoAloc:pool-sum(Object.values(C),c=>c.rat),proj:C}};
}
const entraRateio=f=>f.tipo==='Despesa'&&!f.projetoId&&f.cat!=='Insumos de laboratório'&&f.cat!=='Impostos';
const prpValor=p=>num(p.qtd)*num(p.preco);
const prob=p=>(S.lists.prob||{})[p.etapa]!=null?S.lists.prob[p.etapa]:0;
const aberta=p=>p.etapa!=='Aprovada'&&p.etapa!=='Perdida';
const espName=id=>(IX.esp[id]||{}).name||'—';
const cliName=id=>(IX.cli[id]||{}).name||'—';
const prjOf=prpId=>S.projetos.find(j=>j.propostaId===prpId);
const finYM=f=>String(f.date||'').slice(0,7);
function nextCode(prefix,arr,width){let mx=0;arr.forEach(x=>{const m=String(x.code||'').match(/(\d+)\s*$/);if(m&&String(x.code).startsWith(prefix))mx=Math.max(mx,+m[1]);});return prefix+String(mx+1).padStart(width||3,'0');}

function bdg(t){const m={'Aprovada':'bA','No prazo':'bA','OK':'bA','Recebido':'bA','Pago':'bA','Entregue':'bA',

function toast(msg,o){
  o=o||{};const el=document.createElement('div');el.className='toast';
  el.innerHTML=ic(o.icon||'check')+'<span>'+esc(msg)+'</span>'+(o.undo?'<button data-act="undo">Desfazer</button>':'');
  $('#toasts').appendChild(el);
  while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),320);},o.undo?6500:3800);
}

/* =====================================================================
   PLANEJADOR DE MULTIPLICAÇÃO
   ===================================================================== */
function planDef(){return {esp:'',expl:1,taxa:3,dias:15,perda:0,meta:10000,pa:10,pos:60,ini:TODAY};}
function planCalc(p){
  const tl=num(p.taxa)*(1-num(p.perda)/100),need=Math.ceil(num(p.meta)/(1-num(p.pa)/100));
  let ciclos=null;if(num(p.expl)>=need)ciclos=0;else if(tl>1&&num(p.expl)>0)ciclos=Math.ceil(Math.log(need/num(p.expl))/Math.log(tl)-1e-9);
  const rows=[];let v=num(p.expl);for(let k=0;k<=Math.max(12,(ciclos||0)+2)&&k<=40;k++){if(k>0)v=Math.round(v*num(p.taxa)*(1-num(p.perda)/100));rows.push({k,date:addD(p.ini||TODAY,k*num(p.dias)),v});}
  const fim=ciclos!=null?addD(p.ini||TODAY,ciclos*num(p.dias)):'';
  return {tl,need,ciclos,fim,pronto:fim?addD(fim,num(p.pos)):'',rows};
}
VIEWS.planejador=()=>{
  const p=U.plan=Object.assign(planDef(),U.plan||{});const r=planCalc(p);
  const fld=(k,l,t,h,st)=>`<div class="fld half"><label>${l}</label><input class="in mono" type="${t||'number'}" data-in="plan.${k}" value="${esc(p[k])}"${st?' step="'+st+'"':''} min="0">${h?'<div class="help">'+h+'</div>':''}</div>`;
  $('#main').innerHTML=`<div class="grid">
    <div class="card c4"><h2>Parâmetros</h2><p class="sub" style="margin-bottom:12px">Ex.: 1 planta × 3 a cada 15 dias → 3, 9, 27, 81…</p>
      <div class="mf" style="padding:0">
        <div class="fld"><label>Espécie (preenche taxa, dias e perdas)</label><select class="in" data-ch="planEsp">${opts(S.especies.map(e=>[e.id,e.name]),p.esp,'— manual —')}</select></div>
        <div class="fld"><label>Usar um projeto (estoque atual e mudas que faltam)</label><select class="in" data-ch="planPrj">${opts(S.projetos.filter(j=>D.P[j.id].ativo).map(j=>[j.id,j.code+' · '+(D.P[j.id].cli||{}).name]),'','— nenhum —')}</select></div>
        ${fld('expl','Explantes iniciais')}${fld('taxa','Taxa por ciclo (×)',null,null,'0.1')}${fld('dias','Dias por ciclo')}${fld('perda','Perda por ciclo (%)',null,'contaminação','0.5')}
        ${fld('meta','Meta de mudas prontas')}${fld('pa','Perda na aclimatização (%)',null,null,'0.5')}${fld('pos','Dias de enraizamento + aclimatização')}${fld('ini','Data de início','date')}
      </div></div>
    <div class="card c8"><div class="grid" style="gap:10px;margin-bottom:12px">
        <div class="card c3 kpi" style="padding:12px"><div class="lab">Taxa líquida</div><div class="val az">${fN(r.tl,2)}×</div><div class="dl">por ciclo, já com perdas</div></div>
        <div class="card c3 kpi" style="padding:12px"><div class="lab">Plantas p/ enraizar</div><div class="val">${fN(r.need)}</div><div class="dl">meta ÷ (1 − perda aclim.)</div></div>
        <div class="card c3 kpi" style="padding:12px"><div class="lab">Ciclos necessários</div><div class="val cr">${r.ciclos==null?'—':r.ciclos}</div><div class="dl">${r.ciclos==null?'taxa líquida precisa ser > 1':'fim em '+fD(r.fim)}</div></div>
        <div class="card c3 kpi" style="padding:12px"><div class="lab">Mudas prontas a partir de</div><div class="val">${fD(r.pronto)}</div><div class="dl">${r.pronto?rel(r.pronto):''}</div></div></div>
      <div style="height:250px"><canvas id="chPlan"></canvas></div>
      <div class="tw" style="margin-top:12px;max-height:280px"><table class="tbl"><thead><tr><th class="r">Ciclo</th><th>Data</th><th class="r">Plantas no fim do ciclo</th><th>Situação</th></tr></thead><tbody>
      ${r.rows.map((x,i)=>{const hit=x.v>=r.need&&(i===0||r.rows[i-1].v<r.need);return `<tr class="${hit?'sel':''}"><td class="m r">${x.k}</td><td class="m">${fD(x.date)}</td><td class="m r">${fN(x.v)}</td><td>${hit?'<span class="bdg bA">meta atingida neste ciclo</span>':x.v>=r.need?'<span class="faint">acima da meta</span>':''}</td></tr>`;}).join('')}
      </tbody></table></div></div></div>`;
  const rows=r.rows.slice(0,(r.ciclos!=null?r.ciclos+2:13));
  mkChart('chPlan',{type:'bar',data:{labels:rows.map(x=>'C'+x.k+' · '+fDs(x.date)),datasets:[{label:'Plantas',data:rows.map(x=>x.v),backgroundColor:rows.map(x=>x.v>=r.need?COLORS.verde:COLORS.teal),borderRadius:4},
    {type:'line',label:'Necessário',data:rows.map(()=>r.need),borderColor:COLORS.ambar,borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},
    options:{maintainAspectRatio:false,scales:{y:{type:U.planLog?'logarithmic':'linear',ticks:{callback:v=>fN(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fN(c.raw)}}}}});
};

VIEWS.financeiro=()=>{

  if(!U.mes)U.mes=CUR_YM;

  const aRec=sum(S.fin.filter(f=>f.sit==='A receber'),f=>num(f.valor)),aPag=sum(S.fin.filter(f=>f.sit==='A pagar'),f=>num(f.valor));
  const ls=fm.filter(f=>(!U.fTipo||f.tipo===U.fTipo)&&(!U.fSit||f.sit===U.fSit)).sort((a,b)=>b.date.localeCompare(a.date));
  const C=D.C;

      <select class="in sm" data-ch="fTipo">${opts(['Receita','Despesa'],U.fTipo,'Receitas e despesas')}</select>
      <select class="in sm" data-ch="fSit">${opts(['Recebido','A receber','Pago','A pagar'],U.fSit,'Todas as situações')}</select>
      <span class="grow"></span><button class="btn sm" data-act="exportFin">${ic('download')}Exportar CSV</button><button class="btn pri" data-act="newFin">${ic('plus')}Lançamento</button></div>
    <div class="grid">
      ${kpi('Receitas',fR(rec),U.mes==='all'?'todo o período':ymLong(U.mes),'cr')}${kpi('Despesas',fR(des),fm.filter(f=>f.tipo==='Despesa').length+' lançamentos','db')}
      ${kpi('Resultado',fR(rec-des),rec?'margem '+fP((rec-des)/rec):'sem receitas no período',rec-des<0?'db':'cr')}${kpi('A receber · a pagar',fRs(aRec)+' · '+fRs(aPag),'saldo em aberto de todos os meses','az')}
      <div class="card" style="padding:0"><div class="tw" style="border:none"><table class="tbl"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Cliente / fornecedor</th><th>Projeto</th><th class="r">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>
      ${ls.map(f=>`<tr><td class="m">${fD(f.date)}</td><td>${f.tipo==='Receita'?'<span class="pos">Receita</span>':'<span class="neg">Despesa</span>'}</td><td>${esc(f.cat)}${entraRateio(f)?'<span class="sub2">entra no rateio</span>':''}</td><td>${esc(f.desc)}</td><td>${esc(f.quem||'—')}</td><td>${lnkPrj(IX.prj[f.projetoId])}</td>
        <td class="m r ${f.tipo==='Receita'?'pos':''}">${fR2(num(f.valor))}</td><td class="m ${(f.sit==='A pagar'||f.sit==='A receber')&&f.venc<TODAY?'neg':''}">${fD(f.venc)}</td><td>${bdg(f.sit)}</td>
        <td class="nw r">${f.sit==='A pagar'||f.sit==='A receber'?'<button class="btn sm" data-act="quitar" data-id="'+f.id+'">'+ic('check')+(f.sit==='A pagar'?'Pago':'Recebido')+'</button> ':''}<button class="ibtn sm" data-act="editFin" data-id="${f.id}" aria-label="Editar">${ic('edit')}</button><button class="ibtn sm" data-act="delFin" data-id="${f.id}" aria-label="Excluir">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="10">'+empty('Nenhum lançamento com esses filtros.')+'</td></tr>'}

        <div class="tw"><table class="tbl"><thead><tr><th>Projeto</th><th>Cliente</th><th class="r">Receita</th><th class="r">Impostos</th><th class="r">Insumos</th><th class="r">Diretas</th><th class="r">Frascos</th><th class="r">Rateio</th><th class="r">Custo total</th><th class="r">Custo/muda da meta</th><th class="r">Receita líquida consumida</th><th class="r">Resultado até agora</th></tr></thead><tbody>
        ${S.projetos.map(p=>{const c=C.proj[p.id],x=D.P[p.id];return `<tr><td>${lnkPrj(p)}</td><td>${esc(x.cli?x.cli.name:'—')}</td><td class="m r">${fR(c.rec)}</td><td class="m r">${fR(c.imp)}</td><td class="m r">${fR2(c.insv)}</td><td class="m r">${fR(c.dir)}</td><td class="m r">${fN(c.frp)}</td><td class="m r">${fR(c.rat)}</td><td class="m r"><b>${fR(c.tot)}</b></td><td class="m r">${c.unit!=null?fR2(c.unit):'—'}</td>

        </tbody></table></div></div></div>`;

const DR={open:false,type:'',id:''};

function renderDrawer(){

    el.innerHTML=`<div class="dwh"><div class="dwt"><div class="ttl" style="border:none">${esc(p.code)} · ${esc(cliName(p.clienteId))}</div>
        <div class="dws">${bdg(p.etapa)}<span class="mono" style="color:var(--text);font-weight:600">${fR(prpValor(p))}</span> · ${esc(espName(p.especieId))}</div></div>
      <div class="dwa">${p.etapa==='Aprovada'&&!j?'<button class="btn won" data-act="mkPrj" data-id="'+p.id+'">'+ic('target')+'Criar projeto</button>':''}

        <button class="ibtn" data-act="editPrp" data-id="${p.id}" title="Editar" aria-label="Editar">${ic('edit')}</button><button class="ibtn" data-act="delPrp" data-id="${p.id}" title="Excluir" aria-label="Excluir">${ic('trash')}</button>
        <button class="ibtn" data-act="closeDrawer" title="Fechar (Esc)" aria-label="Fechar">${ic('x')}</button></div></div>
      <div class="sbar" role="group" aria-label="Etapas">${et.map((s,i)=>`<button class="sseg${i<ix&&p.etapa!=='Perdida'?' done':''}${i===ix?' cur':''}" data-act="setEtapa" data-id="${p.id}" data-e="${esc(s)}">${esc(s)}<small>${fP(prob({etapa:s}),0)}</small></button>`).join('')}</div>
      <div class="dwb"><aside><div class="dsec"><h4>Proposta</h4>
        ${[['Cliente',esc(cliName(p.clienteId))],['Data',fD(p.date)],['Espécie',esc(espName(p.especieId))],['Quantidade',fN(num(p.qtd))+' mudas'],['Preço por muda',fR2(num(p.preco))],['Valor total','<b>'+fR2(prpValor(p))+'</b>'],['Prazo de entrega',fD(p.prazo)],['Validade',fD(p.validade)+(aberta(p)&&p.validade<TODAY?' <span class="neg">vencida</span>':'')],['Probabilidade',fP(prob(p),0)],['Valor ponderado',fR(prpValor(p)*prob(p))]].map(r=>'<div class="kv"><label>'+r[0]+'</label><span>'+r[1]+'</span></div>').join('')}</div></aside>
        <div><div class="dsec"><h4>Observações</h4><p style="font-size:13px">${esc(p.obs||'—')}</p></div>
        ${j?`<div class="dsec"><h4>Projeto de produção</h4><p style="font-size:13px">${lnkPrj(j)} · ${bdg(j.status)} · ${fN(D.P[j.id].prev)} de ${fN(D.P[j.id].meta)} mudas previstas · conclusão prevista ${fD(D.P[j.id].concl)} ${bdg(D.P[j.id].sit)}</p></div>`:''}
        ${(()=>{const e=IX.esp[p.especieId];if(!e)return '';const n=Math.ceil(num(p.qtd)/(1-num(e.perdaAclim)));const tl=num(e.taxa)*(1-num(e.perda));
          return `<div class="dsec"><h4>Estimativa de produção</h4><p style="font-size:12.5px;line-height:1.6">Para ${fN(num(p.qtd))} mudas são necessárias cerca de <b>${fN(n)}</b> plantas no enraizamento (perda de ${fP(num(e.perdaAclim),0)} na aclimatização). Com taxa líquida de <b>${fN(tl,2)}×</b> a cada ${e.dias} dias, partindo de 50 explantes, são <b>${Math.ceil(Math.log(n/50)/Math.log(tl))}</b> ciclos de multiplicação, mais ${e.enraiz+e.aclim} dias de enraizamento e aclimatização: cerca de <b>${Math.round((Math.ceil(Math.log(n/50)/Math.log(tl))*e.dias+e.enraiz+e.aclim)/30)} meses</b>.</p>
          <button class="btn sm" data-act="planFromPrp" data-id="${p.id}">${ic('trend')}Abrir no planejador</button></div>`;})()}</div></div>`;
  }

        <button class="ibtn" data-act="closeDrawer" title="Fechar (Esc)" aria-label="Fechar">${ic('x')}</button></div></div>
      <div class="sbar" role="group" aria-label="Status do projeto">${S.lists.statusProj.filter(s=>s!=='Cancelado').map((s,i,a)=>{const ix=a.indexOf(p.status);return `<button class="sseg${i<ix?' done':''}${i===ix?' cur':''}" data-act="setStatus" data-id="${p.id}" data-e="${esc(s)}">${esc(s)}</button>`;}).join('')}</div>
      <div class="dwb"><aside>
        <div class="dsec"><h4>Andamento</h4><div class="pmeta"><span class="mono">${fN(x.prev)} de ${fN(x.meta)} mudas</span><b class="mono">${fP(x.pct,0)}</b></div>${pbar(x.pct)}
          ${[['Em multiplicação',fN(x.plantas)+' explantes'],['Enviadas p/ enraizar',fN(x.env)],['Taxa líquida real',x.taxa?fN(x.taxa,2)+'× por ciclo':'—'],['Ciclos restantes',x.ciclos==null?'—':x.ciclos],['Última repicagem',fD(x.last)],['Conclusão prevista','<b>'+fD(x.concl)+'</b>'],['Prazo de entrega',fD(x.pr.prazo)],['Início',fD(p.inicio)]].map(r=>'<div class="kv"><label>'+r[0]+'</label><span class="mono">'+r[1]+'</span></div>').join('')}</div>
        <div class="dsec"><h4>Custo até agora</h4>${[['Receita contratada',fR(c.rec)],['Impostos',fR(c.imp)],['Insumos consumidos',fR2(c.insv)],['Despesas diretas',fR(c.dir)],['Rateio ('+fN(c.frp)+' frascos)',fR(c.rat)],['Custo total','<b>'+fR(c.tot)+'</b>'],['Resultado até agora','<b class="'+(c.res<0?'neg':'pos')+'">'+fR(c.res)+'</b>']].map(r=>'<div class="kv"><label>'+r[0]+'</label><span class="mono">'+r[1]+'</span></div>').join('')}</div></aside>
      <div><div class="dsec"><h4>Lotes do projeto</h4>${x.lots.length?`<table class="tbl"><thead><tr><th>Lote</th><th>Matriz</th><th>Fase</th><th class="r">Ciclos</th><th class="r">Estoque</th><th class="r">Enraizamento</th><th>Próxima repicagem</th></tr></thead><tbody>${x.lots.map(l=>{const y=D.L[l.id];return `<tr><td>${lnkLote(l)}</td><td class="m">${esc(y.mat?y.mat.code:'—')}</td><td>${esc(l.fase)}</td><td class="m r">${y.ciclos}</td><td class="m r"><b>${fN(y.est)}</b></td><td class="m r">${fN(y.env)}</td><td class="nw m">${fD(y.prox)} ${bdg(y.alerta)}</td></tr>`;}).join('')}</tbody></table>`:empty('Nenhum lote ligado a este projeto. Crie um lote a partir de uma matriz aprovada.')}</div>
        <div class="dsec"><h4>Evolução da multiplicação</h4>${x.lots.some(l=>D.L[l.id].ciclos)?'<div style="height:220px"><canvas id="chPrj"></canvas></div>':empty('Sem repicagens ainda.')}</div></div></div>`;
    const ser=x.lots.filter(l=>D.L[l.id].ciclos);
    if(ser.length){const dates=[...new Set(ser.flatMap(l=>D.L[l.id].reps.map(r=>r.date)))].sort();const pal=[COLORS.teal,COLORS.aco,COLORS.roxo,COLORS.ambar,COLORS.verde];

        options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>fN(v)}}}}});}

let MOD=null;
function modal(html,cls){const m=$('#modal');m.innerHTML='<div class="mbox '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div>';m.classList.add('on');
  setTimeout(()=>{const f=$('#modal input:not([type=hidden]):not([type=checkbox]),#modal select,#modal textarea');if(f&&!m.contains(document.activeElement))f.focus();},30);}

function fieldHTML(f){
  const id='f_'+f.k,v=f.value==null?'':f.value;let inp;
  if(f.type==='select')inp='<select class="in" id="'+id+'" name="'+f.k+'">'+opts(f.options,v,f.first)+'</select>';
  else if(f.type==='textarea')inp='<textarea class="in" id="'+id+'" name="'+f.k+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';

function printDoc(title,html){const w=window.open('','_blank');if(!w){toast('Libere as janelas pop-up para imprimir',{icon:'alert'});return;}
  w.document.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>'+esc(title)+'</title><style>body{font-family:Arial,sans-serif;color:#1F2937;margin:36px;font-size:13px;line-height:1.5}h1{font-size:20px;margin:0 0 4px;color:#1E3A5C}h2{font-size:14px;margin:22px 0 8px;color:#1E3A5C;border-bottom:1px solid #C9D3DF;padding-bottom:4px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #C9D3DF;padding:6px 8px;text-align:left}th{background:#EEF2F7}.r{text-align:right}.muted{color:#5E7288;font-size:11.5px}.tot{font-size:16px;font-weight:bold}</style></head><body>'+html+'<script>window.onload=()=>window.print();<\/script></body></html>');w.document.close();}

function openSearch(){MOD={search:true};
  modal('<div class="srch"><div class="sh">'+ic('search','lg')+'<input class="in" id="sq" placeholder="Buscar cliente, proposta, projeto, lote, matriz ou insumo…" autocomplete="off"><kbd>Esc</kbd></div><div id="sres" class="sres"></div></div>','wide');
  searchRun('');setTimeout(()=>$('#sq').focus(),40);}
function searchRun(q){const n=norm(q),R=[];const hit=s=>!n||norm(s).includes(n);
  S.clientes.forEach(c=>hit(c.code+' '+c.name+' '+c.cidade)&&R.push(['users',c.name,'Cliente · '+c.code,'editCli',c.id]));
  S.propostas.forEach(p=>hit(p.code+' '+cliName(p.clienteId)+' '+espName(p.especieId))&&R.push(['file',p.code+' · '+cliName(p.clienteId),'Proposta · '+p.etapa+' · '+fR(prpValor(p)),'openPrp',p.id]));
  S.projetos.forEach(j=>{const x=D.P[j.id];hit(j.code+' '+(x.cli||{}).name)&&R.push(['target',j.code+' · '+((x.cli||{}).name||''),'Projeto · '+j.status,'openPrj',j.id]);});
  S.lotes.forEach(l=>hit(l.code+' '+espName((IX.mat[l.matrizId]||{}).especieId)+' '+l.sala)&&R.push(['flask',l.code,'Lote · '+espName((IX.mat[l.matrizId]||{}).especieId)+' · '+l.fase,'trace',l.id]));
  S.matrizes.forEach(m=>hit(m.code+' '+m.origem)&&R.push(['leaf',m.code,'Matriz · '+espName(m.especieId)+' · '+m.sanit,'editMat',m.id]));
  S.insumos.forEach(i=>hit(i.code+' '+i.name)&&R.push(['box',i.name,'Insumo · saldo '+fQ(D.I[i.id].saldo)+' '+i.un,'editIns',i.id]));
  $('#sres').innerHTML=R.slice(0,40).map(r=>'<button class="sri" data-act="'+r[3]+'" data-id="'+r[4]+'" data-closem="1">'+ic(r[0])+'<span><b>'+esc(r[1])+'</b><span class="sub2">'+esc(r[2])+'</span></span></button>').join('')||empty('Nada encontrado.');}

function renderBell(){const a=alerts(),b=$('#bell'),r=$('#bellBtn').getBoundingClientRect();
  b.style.top=(r.bottom+8)+'px';b.style.right=Math.max(8,window.innerWidth-r.right)+'px';

function dl(name,text,mime){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{if(typeof v==='number')v=String(+v.toFixed(4)).replace('.',',');v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function dlCSV(name,rows){dl(name+'-'+TODAY+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Arquivo '+name+'.csv baixado (abre no Excel)',{icon:'download'});}

/* =====================================================================
   PASTA DO COMPUTADOR (ex.: D:\\Biofabrica) — banco de dados local
   ===================================================================== */
const DK={h:null,state:'none',msg:'',timer:null,busy:false,again:false,at:null,asked:false};
const DISK_OK=()=>typeof window.showDirectoryPicker==='function'||!!DK.h;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dfa-biofabrica',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));}
const idbSet=(k,v)=>idbDo('readwrite',s=>s.put(v,k)).catch(()=>{}),idbGet=k=>idbDo('readonly',s=>s.get(k)).catch(()=>null),idbDel=k=>idbDo('readwrite',s=>s.delete(k)).catch(()=>{});
function diskSet(st,msg){DK.state=st;DK.msg=msg||'';renderDisk();}
function renderDisk(){const el=$('#diskChip');if(!el)return;if(!DISK_OK()){el.hidden=true;return;}el.hidden=false;
  const L={none:['wait','Conectar pasta do PC'],perm:['wait','Reativar pasta do PC'],ok:['ok','PC'+(DK.at?' · '+DK.at.slice(11,16):'')],err:['bad','Erro na pasta do PC']}[DK.state]||['',''];
  el.className='syncchip '+L[0];el.innerHTML='<i></i>'+ic('hdd')+'<span>'+esc(L[1])+'</span>';
  el.title={none:'Escolha uma pasta no computador (ex.: D:\\Biofabrica) para gravar a base a cada alteração.',perm:'Clique para liberar o acesso à pasta '+(DK.h?DK.h.name:''),ok:'Gravado na pasta '+(DK.h?DK.h.name:''),err:'Não consegui gravar: '+DK.msg}[DK.state]||'';}
async function diskInit(){if(!DISK_OK()){renderDisk();return;}const h=await idbGet('diskDir');if(!h||typeof h.queryPermission!=='function'){diskSet('none');return;}
  DK.h=h;let p='prompt';try{p=await h.queryPermission({mode:'readwrite'});}catch(e){}diskSet(p==='granted'?'ok':'perm');}
async function diskPick(){try{const h=await window.showDirectoryPicker({id:'dfa-bio',mode:'readwrite',startIn:'documents'});DK.h=h;await idbSet('diskDir',h);diskSet('ok');await diskWrite();
  if(DK.state==='ok')toast('Pasta “'+h.name+'” conectada: a base é gravada nela a cada alteração');render();}
  catch(e){if(!e||e.name!=='AbortError')toast('Não foi possível usar a pasta: '+((e&&e.message)||e),{icon:'alert'});}}
async function diskGrant(){if(!DK.h)return diskPick();try{const p=await DK.h.requestPermission({mode:'readwrite'});if(p==='granted'){diskSet('ok');await diskWrite();}else diskSet('perm');}catch(e){diskSet('perm');}}
function diskSoon(ms){if(!DK.h||DK.state!=='ok')return;clearTimeout(DK.timer);DK.timer=setTimeout(()=>{DK.timer=null;diskWrite();},ms==null?1500:ms);}
async function diskFile(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();}
async function diskWrite(){if(!DK.h)return;if(DK.busy){DK.again=true;return;}DK.busy=true;clearTimeout(DK.timer);DK.timer=null;
  try{const txt=JSON.stringify(Object.assign({savedAt:new Date().toISOString()},S),null,1);await diskFile(DK.h,'biofabrica-base.json',txt);
    const hist=await DK.h.getDirectoryHandle('historico',{create:true});await diskFile(hist,'biofabrica-'+isoD(new Date())+'.json',txt);
    const d=new Date();DK.at=TODAY+'T'+pad(d.getHours())+':'+pad(d.getMinutes());diskSet('ok');}
  catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))diskSet('perm');else diskSet('err',(e&&e.message)||String(e));}
  finally{DK.busy=false;}if(DK.again){DK.again=false;diskSoon(600);}}
document.addEventListener('pointerdown',()=>{if(DK.state==='perm'&&!DK.asked){DK.asked=true;diskGrant();}},true);

  quitar:t=>{const f=S.fin.find(x=>x.id===t.dataset.id);snap();f.sit=f.sit==='A pagar'?'Pago':'Recebido';f.pag=TODAY;commit(f.desc+': '+f.sit.toLowerCase());},
  newEsp:()=>{snap();S.especies.push({id:uid('e'),name:'Nova espécie',taxa:3,dias:21,perda:.05,enraiz:21,aclim:45,perdaAclim:.1,preco:1});commit('Espécie adicionada: edite os índices na tabela');},
  delEsp:t=>{const e=IX.esp[t.dataset.id];if(delGuard(S.matrizes.filter(m=>m.especieId===e.id).concat(S.propostas.filter(p=>p.especieId===e.id)),'Esta espécie está em uso em matrizes ou propostas.'))return;
    confirmDlg('Excluir a espécie '+e.name+'?',()=>{snap();S.especies=S.especies.filter(x=>x.id!==e.id);commit('Espécie excluída');},'Excluir');},
  backup:()=>{dl('biofabrica-backup-'+TODAY+'.json',JSON.stringify(S,null,1),'application/json');toast('Backup baixado',{icon:'download'});},
  restore:()=>pickFile('.json,application/json',txt=>{let o;try{o=JSON.parse(txt);}catch(e){toast('Arquivo inválido',{icon:'alert'});return;}
    if(!validBase(o)){toast('Este arquivo não é uma base da biofábrica',{icon:'alert'});return;}
    confirmDlg('Substituir a base atual pelo backup ('+o.lotes.length+' lotes, '+o.propostas.length+' propostas)?',()=>{snap();delete o.savedAt;S=o;commit('Backup restaurado');},'Restaurar');}),
  resetDemo:()=>confirmDlg('Restaurar os dados de demonstração? A base atual deste navegador será substituída.',()=>{snap();S=clone(DEMO);commit('Dados de demonstração restaurados');},'Restaurar'),
  startFresh:()=>confirmDlg('Começar com a base vazia? Ficam só as espécies e as listas; clientes, propostas, produção, estoque e financeiro são apagados (baixe um backup antes, se precisar).',()=>{snap();
    const keep={v:1,demo:false,cfg:Object.assign({},S.cfg,{company:'Minha biofábrica'}),lists:clone(S.lists),especies:clone(S.especies)};
    ['clientes','propostas','projetos','matrizes','lotes','reps','insumos','movs','fin'].forEach(k=>keep[k]=[]);S=keep;U.tab='config';commit('Base vazia criada: comece por Configurações e Clientes');},'Começar do zero'),
  diskChip:()=>{if(DK.state==='perm')return diskGrant();if(DK.state==='none')return diskPick();U.tab='config';render();},
  diskPick:()=>diskPick(),diskNow:async()=>{await diskWrite();if(DK.state==='ok')toast('Base gravada na pasta do computador');render();},
  diskOff:()=>confirmDlg('Desconectar a pasta do computador? Os arquivos já gravados continuam lá.',()=>{DK.h=null;idbDel('diskDir');diskSet('none');render();},'Desconectar')
},EXP);
const C={
  fFase:t=>{U.fFase=t.value;render();},fIns:t=>{U.fIns=t.value;render();},mes:t=>{U.mes=t.value;render();},fTipo:t=>{U.fTipo=t.value;render();},fSit:t=>{U.fSit=t.value;render();},
  lote:t=>{U.lote=t.value;render();},
  planEsp:t=>{const e=IX.esp[t.value];U.plan=Object.assign({},U.plan,{esp:t.value});if(e)Object.assign(U.plan,{taxa:e.taxa,dias:e.dias,perda:+(num(e.perda)*100).toFixed(2),pa:+(num(e.perdaAclim)*100).toFixed(2),pos:num(e.enraiz)+num(e.aclim)});render();},
  planPrj:t=>{const j=IX.prj[t.value];if(!j)return;const x=D.P[j.id],e=x.esp||{};U.plan=Object.assign({},U.plan,{esp:e.id||'',expl:x.plantas,taxa:x.taxa?+x.taxa.toFixed(3):e.taxa,perda:0,dias:e.dias,meta:x.falta,pa:+(x.pa*100).toFixed(2),pos:num(e.enraiz)+num(e.aclim),ini:x.last||TODAY});
    render();toast('Planejador com os dados do '+j.code+': estoque atual, mudas que faltam e taxa líquida real');}
};
document.addEventListener('click',e=>{
  const bell=$('#bell');if(bell.classList.contains('on')&&!e.target.closest('#bell')&&!e.target.closest('#bellBtn'))bell.classList.remove('on');
  const t=e.target.closest('[data-act]');
  if(t&&!t.disabled){if(DRAG.justDropped&&t.closest('.dcard'))return;
    if(t.dataset.closem)closeModal();if(t.closest('#bell'))bell.classList.remove('on');
    const f=A[t.dataset.act];if(f){if(t.tagName==='A')e.preventDefault();e.stopPropagation();f(t,e);}return;}
  if(e.target.id==='modal'&&MDT===e.target)closeModal();
});
let MDT=null;document.addEventListener('mousedown',e=>{MDT=e.target;});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.closest('#mform')&&MOD){if(MOD.onInput)MOD.onInput();return;}
  if(t.dataset.esp){const x=IX.esp[t.dataset.esp];if(!x)return;snap();let v=t.value;if(t.dataset.t==='pct')v=num(v)/100;else if(t.dataset.t==='number')v=num(v);x[t.dataset.f]=v;commit();return;}
  if(t.dataset.cfg){snap();S.cfg[t.dataset.cfg]=t.dataset.cfg==='aliq'?num(t.value)/100:t.value;commit('Parâmetro atualizado');return;}
  if(t.dataset.in&&t.dataset.in.startsWith('plan.')){U.plan[t.dataset.in.slice(5)]=t.type==='date'?t.value:t.value===''?'':+t.value;render();return;}
  const c=t.closest('[data-ch]');if(c&&C[c.dataset.ch])C[c.dataset.ch](c,e);
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sq'){searchRun(t.value);return;}if(t.closest('#mform')&&MOD&&MOD.onInput)MOD.onInput();});
document.addEventListener('submit',e=>{const fm=e.target;e.preventDefault();if(fm.id==='mform'&&MOD&&MOD.onSave){const r=MOD.onSave(formVals());if(r)closeModal();}});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){closeModal();return;}if($('#bell').classList.contains('on')){$('#bell').classList.remove('on');return;}if(DR.open){closeDrawer();return;}}
  if(e.key==='Enter'&&!typing){const t=e.target.closest&&e.target.closest('[data-act][tabindex]');if(t){t.click();return;}}
  if(MOD&&MOD.search&&(e.key==='Enter')){const it=$('#sres .sri');if(it){e.preventDefault();it.click();}}
});

/* ---------------- arrastar e soltar (funil comercial) ---------------- */
const DRAG={id:null,justDropped:false};
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;DRAG.id=c.dataset.drag;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';setTimeout(()=>c.classList.add('dragging'),0);});
document.addEventListener('dragend',()=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.col.over').forEach(x=>x.classList.remove('over'));DRAG.id=null;});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col||!DRAG.id)return;e.preventDefault();e.dataTransfer.dropEffect='move';$$('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain')||DRAG.id;col.classList.remove('over');
  DRAG.justDropped=true;setTimeout(()=>DRAG.justDropped=false,120);if(id)setEtapa(id,col.dataset.drop);});

/* ---------------- inicialização ---------------- */
if(window.Chart){
  Chart.defaults.color='#8FA3B8';Chart.defaults.font.family="'IBM Plex Mono',ui-monospace,Consolas,monospace";Chart.defaults.font.size=10.5;
  Chart.defaults.borderColor='rgba(35,54,74,.7)';Chart.defaults.plugins.legend.labels.boxWidth=10;Chart.defaults.plugins.legend.labels.boxHeight=10;
  Chart.defaults.plugins.tooltip.backgroundColor='#0F1927';Chart.defaults.plugins.tooltip.borderColor='#23364A';Chart.defaults.plugins.tooltip.borderWidth=1;
  Chart.defaults.plugins.tooltip.titleColor='#E8EDF3';Chart.defaults.plugins.tooltip.bodyColor='#E8EDF3';
}
render();
diskInit();

</script>
</body>
</html>
